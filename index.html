<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深渊探索者 - 肉鸽地牢</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    user-select: none;
}

#game-container {
    position: relative;
    width: 1024px;
    height: 768px;
}

canvas {
    display: block;
    border: 2px solid #333;
}

#ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
}

#hud {
    position: absolute;
    top: 12px; left: 12px;
    color: #fff;
    font-size: 14px;
    line-height: 1.6;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
}

.hp-bar-bg {
    width: 200px; height: 16px;
    background: #333;
    border: 1px solid #555;
    margin: 4px 0;
}
.hp-bar-fill {
    height: 100%;
    background: linear-gradient(180deg, #e74c3c, #c0392b);
    transition: width 0.3s;
}
.mp-bar-bg {
    width: 200px; height: 8px;
    background: #1a2a3a;
    border: 1px solid #34495e;
    margin: 1px 0;
}
.mp-bar-fill {
    height: 100%;
    background: linear-gradient(180deg, #3498db, #2980b9);
    transition: width 0.3s;
}
.xp-bar-bg {
    width: 200px; height: 8px;
    background: #222;
    border: 1px solid #444;
    margin: 2px 0;
}
.xp-bar-fill {
    height: 100%;
    background: linear-gradient(180deg, #f1c40f, #f39c12);
    transition: width 0.3s;
}

#level-up-notify {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #f1c40f;
    font-size: 32px;
    font-weight: bold;
    text-shadow: 0 0 20px rgba(241,196,15,0.8);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
}

#inventory-panel {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 400px;
    background: rgba(20,20,20,0.95);
    border: 2px solid #555;
    padding: 20px;
    color: #ccc;
    display: none;
    pointer-events: all;
}
#inventory-panel h3 {
    color: #f1c40f;
    margin-bottom: 12px;
    text-align: center;
}
.inv-slot {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #333;
}
.inv-slot .label { color: #888; }
.inv-slot .value { color: #fff; }
.rarity-common { color: #aaa; }
.rarity-rare { color: #3498db; }
.rarity-epic { color: #9b59b6; }
.rarity-legendary { color: #e67e22; }

#game-over-screen {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #fff;
    display: none;
    pointer-events: all;
}
#game-over-screen h1 {
    font-size: 48px;
    color: #e74c3c;
    margin-bottom: 16px;
}
#game-over-screen p {
    font-size: 18px;
    margin: 8px 0;
    color: #aaa;
}
#game-over-screen button {
    margin-top: 20px;
    padding: 10px 30px;
    font-size: 18px;
    background: #e74c3c;
    color: #fff;
    border: none;
    cursor: pointer;
    font-family: inherit;
}
#game-over-screen button:hover { background: #c0392b; }

#equip-bar {
    position: absolute;
    bottom: 8px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    pointer-events: none;
}
.eq-slot {
    background: rgba(20,20,20,0.85);
    border: 1px solid #444;
    padding: 2px 5px;
    text-align: center;
    min-width: 60px;
    border-radius: 3px;
}
.eq-slot.equipped { border-color: #666; }
.eq-slot.empty { border-color: #333; }
.eq-slot .rarity-legendary { border-color: #e67e22; }
.eq-icon { font-size: 14px; }

#shop-panel {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 420px;
    max-height: 500px;
    overflow-y: auto;
    background: rgba(20,20,20,0.96);
    border: 2px solid #f1c40f;
    padding: 20px;
    color: #ccc;
    display: none;
    pointer-events: all;
}
#shop-panel h3 {
    color: #f1c40f;
    margin-bottom: 10px;
    text-align: center;
}
.shop-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 6px;
    border-bottom: 1px solid #333;
    transition: background 0.15s;
}
.shop-item:hover { background: rgba(255,255,255,0.05); }
.shop-item.no-afford { opacity: 0.45; }
.shop-item.sell-item:hover { background: rgba(46,204,113,0.08); }

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

#floor-indicator {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 40px;
    font-weight: bold;
    text-shadow: 0 0 30px rgba(255,255,255,0.6);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
}

</style>
</head>
<body>
<div id="game-container">
<canvas id="game-canvas"></canvas>
<div id="ui-layer">
<div id="hud"></div>
<div id="level-up-notify"></div>
<div id="floor-indicator"></div>
<div id="inventory-panel"></div>
<div id="shop-panel"></div>
<div id="game-over-screen"></div>
<div id="equip-bar"></div>
</div>
</div>
<script>
// Utility functions

function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function randFloat(min, max) {
    return Math.random() * (max - min) + min;
}

function clamp(val, min, max) {
    return Math.max(min, Math.min(max, val));
}

function dist(x1, y1, x2, y2) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
}

function angle(x1, y1, x2, y2) {
    return Math.atan2(y2 - y1, x2 - x1);
}

function lerp(a, b, t) {
    return a + (b - a) * t;
}

function rgb(r, g, b, a = 1) {
    return `rgba(${r},${g},${b},${a})`;
}

function hsl(h, s, l, a = 1) {
    return `hsla(${h},${s}%,${l}%,${a})`;
}

function choice(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

// XP needed to reach next level (1-indexed)
function xpForLevel(level) {
    return Math.floor(level * 100 + Math.pow(level, 1.5) * 50);
}

// Generate a random ID
function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

// Check AABB collision
function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// Point in rect
function pointInRect(px, py, rx, ry, rw, rh) {
    return px >= rx && px <= rx + rw && py >= ry && py <= ry + rh;
}


function calcDamage(atk, def, critChance = 0, critMult = 1.5) {
    const isCrit = Math.random() < critChance;
    const base = atk * randFloat(0.9, 1.1);
    const reduced = Math.max(1, base - def * 0.5);
    const final = Math.floor(isCrit ? reduced * critMult : reduced);
    return { damage: final, crit: isCrit };
}

function createProjectile(x, y, targetX, targetY, speed, damage, color = '#ff0', size = 4) {
    const a = angle(x, y, targetX, targetY);
    return {
        x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        damage, color, size, life: 120, maxLife: 120, active: true
    };
}

function updateProjectile(p, dt) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) p.active = false;
}

// Check if point (px, py) is within range of (tx, ty) for an attack
function inAttackRange(ax, ay, tx, ty, range) {
    return dist(ax, ay, tx, ty) <= range;
}

// Melee attack arc check
function meleeHit(attackerX, attackerY, attackAngle, targetX, targetY, range, arcAngle = Math.PI / 3) {
    const d = dist(attackerX, attackerY, targetX, targetY);
    if (d > range) return false;
    const a = angle(attackerX, attackerY, targetX, targetY);
    let diff = a - attackAngle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    return Math.abs(diff) <= arcAngle;
}


const RARITY = {
    COMMON:    { name: '普通', color: '#aaa', weight: 60, mult: 1.0 },
    RARE:      { name: '稀有', color: '#3498db', weight: 25, mult: 1.3 },
    EPIC:      { name: '史诗', color: '#9b59b6', weight: 10, mult: 1.7 },
    LEGENDARY: { name: '传说', color: '#e67e22', weight: 5, mult: 2.2 }
};

const SLOTS = ['weapon', 'helmet', 'armor', 'boots', 'gloves', 'amulet', 'ring'];
const SLOT_NAMES = {
    weapon: '武器', helmet: '头盔', armor: '护甲',
    boots: '鞋子', gloves: '手套', amulet: '项链', ring: '戒指'
};
const SLOT_ICONS = {
    weapon: '⚔️', helmet: '⛑️', armor: '🛡️',
    boots: '👢', gloves: '🧤', amulet: '📿', ring: '💍'
};

const ITEM_NAMES = {
    weapon:  ['短剑', '长剑', '战斧', '匕首', '魔杖', '巨锤', '镰刀', '拳套', '弯刀', '长矛', '双刃', '刺剑'],
    helmet:  ['布帽', '铁盔', '秘银冠', '龙鳞头巾', '暗影兜帽', '角盔', '圣光冠', '暗盔'],
    armor:   ['皮甲', '链甲', '板甲', '暗影长袍', '龙鳞铠', '骨铠', '符文甲', '血鳞甲'],
    boots:   ['草鞋', '皮靴', '铁靴', '疾风靴', '暗影鞋', '龙鳞靴', '圣光鞋'],
    gloves:  ['布手套', '皮手套', '铁护手', '力量护手', '暗影手套', '龙鳞护手'],
    amulet:  ['骨链', '银链', '金链', '生命护符', '暗影坠', '龙心坠', '圣光符'],
    ring:    ['铜戒', '银戒', '金戒', '力量之戒', '疾风之戒', '暗影戒', '龙鳞戒', '圣光戒']
};

const STAT_NAMES = ['atk', 'def', 'maxHp', 'maxMp', 'crit', 'spd', 'mpRegen'];

function rollRarity() {
    const total = Object.values(RARITY).reduce((s, r) => s + r.weight, 0);
    let roll = rand(1, total);
    for (const [key, r] of Object.entries(RARITY)) {
        roll -= r.weight;
        if (roll <= 0) return { key, ...r };
    }
    return { key: 'COMMON', ...RARITY.COMMON };
}

function generateItem(floor = 1, slot = null) {
    const s = slot || choice(SLOTS);
    const rarity = rollRarity();
    const baseName = choice(ITEM_NAMES[s]);
    const floorScale = 1 + (floor - 1) * 0.1;

    const stats = {};
    const statCount = rand(1, rarity.key === 'LEGENDARY' ? 3 : 2);

    // Slot-specific stat biases
    const slotStats = {
        weapon: ['atk', 'crit'],
        helmet: ['def', 'maxHp'],
        armor:  ['def', 'maxHp'],
        boots:  ['spd', 'def'],
        gloves: ['atk', 'crit'],
        amulet: ['maxMp', 'mpRegen', 'maxHp'],
        ring:   ['crit', 'spd', 'maxMp']
    };

    const preferred = slotStats[s] || STAT_NAMES;
    for (let i = 0; i < statCount; i++) {
        const stat = i === 0 ? choice(preferred) : choice(STAT_NAMES);
        const baseValue = stat === 'maxHp' ? rand(10, 30) :
                          stat === 'maxMp' ? rand(10, 25) :
                          stat === 'mpRegen' ? randFloat(0.5, 2) :
                          stat === 'crit' ? randFloat(0.01, 0.04) :
                          stat === 'spd' ? randFloat(0.1, 0.5) :
                          rand(1, 5);
        stats[stat] = Math.floor(baseValue * rarity.mult * floorScale * 100) / 100;
    }

    return {
        id: uid(),
        name: `${rarity.name} ${baseName}`,
        slot: s,
        rarity: rarity.key,
        rarityName: rarity.name,
        color: rarity.color,
        stats,
        desc: Object.entries(stats).map(([k, v]) => {
            const label = { atk: '攻击', def: '防御', maxHp: '生命', maxMp: '法力', crit: '暴击率', spd: '速度', mpRegen: '回蓝' }[k];
            return `+${v} ${label}`;
        }).join(', ')
    };
}

function generateDrop(floor) {
    const items = [];
    const count = rand(0, 3);
    for (let i = 0; i < count; i++) {
        items.push(generateItem(floor));
    }
    const gold = rand(floor * 8, floor * 20);
    return { items, gold };
}

// ─── Equipment Icon Drawing (unique per item) ───
// Returns a function that draws the icon on a canvas context at (cx, cy, size)
function drawItemIcon(ctx, cx, cy, size, item) {
    const s = size;
    ctx.save();
    ctx.translate(cx, cy);

    // Background rarity glow
    const rarityAlpha = { COMMON: 0.1, RARE: 0.2, EPIC: 0.3, LEGENDARY: 0.45 }[item.rarity] || 0.1;
    ctx.fillStyle = item.color + Math.floor(rarityAlpha * 255).toString(16).padStart(2, '0');
    ctx.beginPath();
    ctx.roundRect(-s/2 - 3, -s/2 - 3, s + 6, s + 6, 4);
    ctx.fill();

    // Background
    ctx.fillStyle = '#1a1a2e';
    ctx.strokeStyle = item.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(-s/2, -s/2, s, s, 3);
    ctx.fill();
    ctx.stroke();

    // Draw slot-specific icon
    ctx.fillStyle = item.color;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;

    switch (item.slot) {
        case 'weapon': _drawWeaponIcon(ctx, item, s); break;
        case 'helmet': _drawHelmetIcon(ctx, s); break;
        case 'armor':  _drawArmorIcon(ctx, s); break;
        case 'boots':  _drawBootsIcon(ctx, s); break;
        case 'gloves': _drawGlovesIcon(ctx, s); break;
        case 'amulet': _drawAmuletIcon(ctx, s); break;
        case 'ring':   _drawRingIcon(ctx, s); break;
    }

    // Rarity stars in corner
    const stars = { COMMON: 0, RARE: 1, EPIC: 2, LEGENDARY: 3 }[item.rarity] || 0;
    ctx.fillStyle = '#f1c40f';
    ctx.font = `${s * 0.25}px sans-serif`;
    for (let i = 0; i < stars; i++) {
        ctx.fillText('★', s/2 - s * 0.3, -s/2 + s * 0.2 + i * s * 0.22);
    }

    // Level requirement hint
    ctx.fillStyle = '#888';
    ctx.font = `${s * 0.16}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(item.slot === 'weapon' ? SLOT_NAMES[item.slot] : '', 0, s/2 + s * 0.2);

    ctx.restore();
}

function _drawWeaponIcon(ctx, item, s) {
    const name = item.name;
    ctx.strokeStyle = item.color;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';

    if (name.includes('剑') || name.includes('刃') || name.includes('刺')) {
        // Sword: vertical blade
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.35);
        ctx.lineTo(0, s * 0.3);
        ctx.stroke();
        ctx.fillStyle = item.color;
        ctx.fillRect(-s * 0.15, -s * 0.15, s * 0.3, s * 0.1);
    } else if (name.includes('斧')) {
        // Axe: wide head
        ctx.beginPath();
        ctx.moveTo(-s * 0.35, -s * 0.15);
        ctx.lineTo(s * 0.35, -s * 0.15);
        ctx.lineTo(s * 0.2, s * 0.05);
        ctx.lineTo(-s * 0.2, s * 0.05);
        ctx.closePath();
        ctx.fill();
        ctx.fillRect(-s * 0.03, -s * 0.05, s * 0.06, s * 0.4);
    } else if (name.includes('锤')) {
        // Hammer: rectangular head
        ctx.fillStyle = item.color;
        ctx.fillRect(-s * 0.3, -s * 0.25, s * 0.6, s * 0.25);
        ctx.fillRect(-s * 0.04, -s * 0.05, s * 0.08, s * 0.4);
    } else if (name.includes('杖')) {
        // Wand: thin stick with orb
        ctx.beginPath();
        ctx.moveTo(0, s * 0.35);
        ctx.lineTo(0, -s * 0.15);
        ctx.stroke();
        ctx.fillStyle = item.color;
        ctx.beginPath();
        ctx.arc(0, -s * 0.22, s * 0.15, 0, Math.PI * 2);
        ctx.fill();
    } else if (name.includes('匕首')) {
        // Dagger: short diagonal
        ctx.beginPath();
        ctx.moveTo(-s * 0.1, -s * 0.3);
        ctx.lineTo(s * 0.2, s * 0.1);
        ctx.stroke();
        ctx.fillRect(-s * 0.1, -s * 0.05, s * 0.2, s * 0.08);
    } else if (name.includes('镰')) {
        // Scythe: curved
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.3, -Math.PI * 0.6, Math.PI * 0.3);
        ctx.stroke();
        ctx.fillRect(-s * 0.03, -s * 0.05, s * 0.06, s * 0.35);
    } else if (name.includes('矛')) {
        // Spear: long with tip
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.4);
        ctx.lineTo(0, s * 0.2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.4);
        ctx.lineTo(-s * 0.12, -s * 0.25);
        ctx.lineTo(s * 0.12, -s * 0.25);
        ctx.closePath();
        ctx.fill();
    } else if (name.includes('拳套')) {
        // Fist: circle
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.25, 0, Math.PI * 2);
        ctx.fill();
    } else {
        // Default sword
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.35);
        ctx.lineTo(0, s * 0.3);
        ctx.stroke();
    }
    ctx.lineCap = 'butt';
}

function _drawHelmetIcon(ctx, s) {
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath();
    ctx.arc(0, -s * 0.05, s * 0.28, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(-s * 0.28, -s * 0.05, s * 0.56, s * 0.15);
    ctx.fillStyle = '#111';
    ctx.fillRect(-s * 0.2, -s * 0.12, s * 0.4, s * 0.04);
}

function _drawArmorIcon(ctx, s) {
    ctx.fillStyle = ctx.strokeStyle;
    // Shoulders
    ctx.fillRect(-s * 0.35, -s * 0.25, s * 0.15, s * 0.15);
    ctx.fillRect(s * 0.2, -s * 0.25, s * 0.15, s * 0.15);
    // Body
    ctx.beginPath();
    ctx.moveTo(-s * 0.2, -s * 0.1);
    ctx.lineTo(-s * 0.3, s * 0.3);
    ctx.lineTo(s * 0.3, s * 0.3);
    ctx.lineTo(s * 0.2, -s * 0.1);
    ctx.closePath();
    ctx.fill();
}

function _drawBootsIcon(ctx, s) {
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fillRect(-s * 0.3, s * 0.05, s * 0.25, s * 0.25);
    ctx.fillRect(s * 0.05, s * 0.05, s * 0.25, s * 0.25);
    ctx.fillRect(-s * 0.3, -s * 0.15, s * 0.6, s * 0.2);
}

function _drawGlovesIcon(ctx, s) {
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath();
    ctx.arc(-s * 0.15, 0, s * 0.18, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s * 0.15, 0, s * 0.18, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-s * 0.25, -s * 0.15, s * 0.5, s * 0.08);
}

function _drawAmuletIcon(ctx, s) {
    // Chain
    ctx.beginPath();
    ctx.arc(0, -s * 0.15, s * 0.25, Math.PI, 0);
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 1;
    ctx.stroke();
    // Gem
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath();
    ctx.moveTo(0, s * 0.2);
    ctx.lineTo(-s * 0.18, 0);
    ctx.lineTo(0, -s * 0.1);
    ctx.lineTo(s * 0.18, 0);
    ctx.closePath();
    ctx.fill();
}

function _drawRingIcon(ctx, s) {
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.22, 0, Math.PI * 2);
    ctx.stroke();
    // Gem
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath();
    ctx.arc(0, -s * 0.22, s * 0.08, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 1;
}


class Particle {
    constructor(x, y, vx, vy, life, color, size = 3) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.life = life;
        this.maxLife = life;
        this.color = color;
        this.size = size;
        this.active = true;
        this.gravity = 0;
    }

    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += this.gravity * dt;
        this.life -= dt;
        if (this.life <= 0) this.active = false;
    }

    get alpha() {
        return Math.max(0, this.life / this.maxLife);
    }
}

// Expanding ring particle (for death/hit effects)
class RingParticle {
    constructor(x, y, startRadius, endRadius, life, color) {
        this.x = x;
        this.y = y;
        this.radius = startRadius;
        this.endRadius = endRadius;
        this.life = life;
        this.maxLife = life;
        this.color = color;
        this.active = true;
    }
    update(dt) {
        this.life -= dt;
        const progress = 1 - this.life / this.maxLife;
        this.radius = this.endRadius * progress;
        if (this.life <= 0) this.active = false;
    }
    get alpha() { return Math.max(0, this.life / this.maxLife); }
}

class ParticleSystem {
    constructor() {
        this.particles = [];
    }

    emit(x, y, count, config = {}) {
        const {
            speed = [30, 120],
            life = [0.3, 0.8],
            color = '#fff',
            size = [2, 5],
            gravity = 0,
            spread = Math.PI * 2
        } = config;

        for (let i = 0; i < count; i++) {
            const a = randFloat(0, spread);
            const s = randFloat(speed[0], speed[1]);
            const l = randFloat(life[0], life[1]);
            const sz = randFloat(size[0], size[1]);
            const p = new Particle(x, y, Math.cos(a) * s, Math.sin(a) * s, l, color, sz);
            p.gravity = gravity;
            this.particles.push(p);
        }
    }

    emitHit(x, y) {
        this.emit(x, y, 8, {
            speed: [40, 150],
            life: [0.2, 0.5],
            color: '#ff4444',
            size: [2, 5],
            spread: Math.PI * 0.8
        });
    }

    emitDeath(x, y, color = '#ff0') {
        // Burst particles
        this.emit(x, y, 25, {
            speed: [30, 200],
            life: [0.3, 0.9],
            color,
            size: [2, 7],
            gravity: 100
        });
        // White spark ring
        this.emit(x, y, 12, {
            speed: [80, 220],
            life: [0.15, 0.35],
            color: '#fff',
            size: [1, 3],
            gravity: 0
        });
        // Expanding ring particles (drawn manually)
        this.particles.push(new RingParticle(x, y, 0, 80, 0.4, color));
    }

    emitCritHit(x, y) {
        this.emit(x, y, 15, {
            speed: [60, 200],
            life: [0.2, 0.5],
            color: '#f1c40f',
            size: [2, 6],
            gravity: 0
        });
        this.particles.push(new RingParticle(x, y, 0, 50, 0.3, '#f1c40f'));
        this.particles.push(new RingParticle(x, y, 0, 30, 0.2, '#fff'));
    }

    emitLevelUp(x, y) {
        this.emit(x, y, 30, {
            speed: [50, 200],
            life: [0.5, 1.2],
            color: '#f1c40f',
            size: [2, 7],
            spread: Math.PI * 2
        });
    }

    emitHeal(x, y) {
        this.emit(x, y, 12, {
            speed: [20, 80],
            life: [0.4, 0.9],
            color: '#2ecc71',
            size: [2, 5],
            gravity: -30
        });
    }

    update(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update(dt);
            if (!this.particles[i].active) {
                this.particles.splice(i, 1);
            }
        }
    }

    draw(ctx, camera) {
        for (const p of this.particles) {
            if (p instanceof RingParticle) {
                ctx.globalAlpha = p.alpha * 0.6;
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 3 * p.alpha;
                ctx.beginPath();
                ctx.arc(p.x - camera.x, p.y - camera.y, p.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.lineWidth = 1;
            } else {
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(
                    p.x - camera.x - p.size / 2,
                    p.y - camera.y - p.size / 2,
                    p.size, p.size
                );
            }
        }
        ctx.globalAlpha = 1;
    }
}

class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 14;
        this.level = 1;
        this.xp = 0;
        this.gold = 0;
        this.hp = BASE_STATS.maxHp;
        this.mp = BASE_STATS.maxMp;

        // Base stats
        this.baseMaxHp = BASE_STATS.maxHp;
        this.baseMaxMp = BASE_STATS.maxMp;
        this.baseAtk = BASE_STATS.atk;
        this.baseDef = BASE_STATS.def;
        this.baseSpd = BASE_STATS.spd;
        this.baseCrit = BASE_STATS.crit;
        this.baseMpRegen = BASE_STATS.mpRegen;
        this.critMult = BASE_STATS.critMult;
        this.attackRange = BASE_STATS.attackRange;
        this.attackSpeed = BASE_STATS.attackSpeed;

        // Equipment (7 slots)
        this.equipment = { weapon: null, helmet: null, armor: null, boots: null, gloves: null, amulet: null, ring: null };
        this.inventory = [];

        // Skills
        this.skills = [];         // Active skills
        this.passives = [];       // Passive skills
        this.skillCooldowns = {};

        // Passive states
        this.cheatDeathCooldown = 0;
        this.berserkTimer = 0;
        this.thornsTimer = 0;

        // Combat state
        this.attackTimer = 0;
        this.invincibleTimer = 0;
        this.dashCooldown = 0;
        this.isDashing = false;
        this.dashDir = { x: 0, y: 0 };
        this.dashTimer = 0;

        // Animation
        this.facingAngle = 0;
        this.animTimer = 0;
        this.hitFlash = 0;
    }

    // ─── Computed stats ───
    _equipStatSum(stat) {
        let sum = 0;
        for (const eq of Object.values(this.equipment)) {
            if (eq && eq.stats[stat]) sum += eq.stats[stat];
        }
        return sum;
    }

    _getPassiveMultiplier(stat) {
        if (stat === 'all') return 0;
        let mult = 1;
        for (const p of this.passives) {
            if (p.stat === stat && p.type === 'pct') mult += p.value;
            if (p.stat === 'all' && p.type === 'pct') mult += p.value;
        }
        return mult;
    }

    _getPassiveFlat(stat) {
        let val = 0;
        for (const p of this.passives) {
            if (p.stat === stat && p.type === 'flat') val += p.value;
        }
        return val;
    }

    get maxHp() {
        const base = this.baseMaxHp + (this.level - 1) * 5 + this._equipStatSum('maxHp');
        return Math.floor(base * this._getPassiveMultiplier('maxHp'));
    }

    get maxMp() {
        const base = this.baseMaxMp + (this.level - 1) * 3 + this._equipStatSum('maxMp');
        return Math.floor(base * this._getPassiveMultiplier('maxMp'));
    }

    get atk() {
        const base = this.baseAtk + (this.level - 1) * 2 + this._equipStatSum('atk');
        return Math.floor(base * this._getPassiveMultiplier('atk') + this._getPassiveFlat('atk'));
    }

    get def() {
        const base = this.baseDef + (this.level - 1) * 1 + this._equipStatSum('def');
        return Math.floor(base * this._getPassiveMultiplier('def') + this._getPassiveFlat('def'));
    }

    get spd() {
        const base = this.baseSpd + this._equipStatSum('spd');
        return base * this._getPassiveMultiplier('spd') + this._getPassiveFlat('spd');
    }

    get crit() {
        return Math.min(0.85, this.baseCrit + (this.level - 1) * 0.002 + this._equipStatSum('crit') + this._getPassiveFlat('crit'));
    }

    get mpRegen() {
        const base = this.baseMpRegen + this._equipStatSum('mpRegen');
        return base * this._getPassiveMultiplier('mpRegen');
    }

    get lifesteal() {
        return this._getPassiveFlat('lifesteal');
    }

    get skillCostMultiplier() {
        return 1 + (this._getPassiveFlat('skillCost') || 0); // negative = cost reduction
    }

    get hpRegen() {
        return this._getPassiveFlat('hpRegen');
    }

    get xpToNext() { return xpForLevel(this.level); }
    get isDead() { return this.hp <= 0; }

    // ─── Leveling ───
    gainXp(amount) {
        if (this.level >= 100) return false;
        this.xp += amount;
        if (this.xp >= this.xpToNext) {
            this.xp -= this.xpToNext;
            this.level++;
            this.hp = Math.min(this.maxHp, this.hp + Math.floor(this.maxHp * 0.3));
            this.mp = this.maxMp; // Full mana on level up
            this.unlockSkills();
            return true;
        }
        return false;
    }

    unlockSkills() {
        // Active skills every 10 levels
        if (this.level % 10 === 0) {
            const skill = ACTIVE_SKILLS[(this.level / 10 - 1) % ACTIVE_SKILLS.length];
            this.skills.push({ ...skill, level: this.level });
            this.skillCooldowns[skill.name] = 0;
        }
        // Passive skills unlocked at specific levels
        for (const ps of PASSIVE_SKILLS) {
            if (this.level === ps.level && !this.passives.find(p => p.name === ps.name)) {
                this.passives.push({ ...ps });
            }
        }
    }

    // ─── Equipment ───
    equipItem(item) {
        const old = this.equipment[item.slot];
        this.equipment[item.slot] = item;
        if (old) this.inventory.push(old);
        this.hp = Math.min(this.hp, this.maxHp);
        this.mp = Math.min(this.mp, this.maxMp);
    }

    // ─── Mana ───
    useMana(amount) {
        const cost = Math.ceil(amount * this.skillCostMultiplier);
        if (this.mp < cost) return false;
        this.mp -= cost;
        return true;
    }

    regenMana(dt) {
        this.mp = Math.min(this.maxMp, this.mp + this.mpRegen * dt);
    }

    // ─── Regen ───
    regenHp(dt) {
        if (this.hpRegen > 0 && this.hp > 0) {
            this.hp = Math.min(this.maxHp, this.hp + this.maxHp * this.hpRegen * dt);
        }
    }

    // ─── Combat ───
    takeDamage(amount) {
        if (this.invincibleTimer > 0) return 0;
        const reduced = Math.max(1, amount - this.def);
        this.hp -= reduced;
        this.hitFlash = 0.15;
        this.invincibleTimer = 0.3;

        // Cheat death
        if (this.hp <= 0 && this.cheatDeathCooldown <= 0 && this.passives.find(p => p.stat === 'cheatDeath')) {
            this.hp = 1;
            const cdPassive = this.passives.find(p => p.stat === 'cheatDeath');
            this.cheatDeathCooldown = cdPassive.value;
        }
        return reduced;
    }

    attack(targetX, targetY, dt) {
        if (this.attackTimer > 0) return null;
        this.attackTimer = this.attackSpeed;
        const a = angle(this.x, this.y, targetX, targetY);
        this.facingAngle = a;
        return { x: targetX, y: targetY, angle: a, range: this.attackRange };
    }

    performMeleeAttack(enemies, targetX, targetY) {
        const a = angle(this.x, this.y, targetX, targetY);
        const hits = [];
        for (const enemy of enemies) {
            if (!enemy.isDead && meleeHit(this.x, this.y, a, enemy.x, enemy.y, this.attackRange)) {
                const { damage, crit } = calcDamage(this.atk, enemy.def, this.crit, this.critMult);
                hits.push({ enemy, damage, crit });
            }
        }
        return hits;
    }

    useSkill(index, enemies, mouseX, mouseY, game) {
        if (index >= this.skills.length) return null;
        const skill = this.skills[index];
        if (this.skillCooldowns[skill.name] > 0) return null;
        if (!this.useMana(skill.cost)) return null; // Not enough mana

        this.skillCooldowns[skill.name] = skill.cd;
        const result = { skill: skill.name, effects: [] };

        switch (skill.name) {
            case '旋风斩': {
                for (const enemy of enemies) {
                    if (!enemy.isDead && dist(this.x, this.y, enemy.x, enemy.y) < 80) {
                        const { damage, crit } = calcDamage(this.atk * 1.5, enemy.def, this.crit, this.critMult);
                        result.effects.push({ enemy, damage, crit });
                    }
                }
                break;
            }
            case '回血术': {
                const heal = Math.floor(this.maxHp * 0.3);
                this.hp = Math.min(this.maxHp, this.hp + heal);
                result.effects.push({ heal });
                break;
            }
            case '冲刺斩': {
                const a = angle(this.x, this.y, mouseX, mouseY);
                this.isDashing = true;
                this.dashDir = { x: Math.cos(a), y: Math.sin(a) };
                this.dashTimer = 0.15;
                this.invincibleTimer = 0.15;
                const cx = this.x + Math.cos(a) * 60;
                const cy = this.y + Math.sin(a) * 60;
                for (const enemy of enemies) {
                    if (!enemy.isDead && dist(cx, cy, enemy.x, enemy.y) < 60) {
                        const { damage, crit } = calcDamage(this.atk * 2, enemy.def, this.crit, this.critMult);
                        result.effects.push({ enemy, damage, crit });
                    }
                }
                break;
            }
            case '狂暴': {
                this.berserkTimer = 5;
                result.effects.push({ buff: 'berserk' });
                break;
            }
            case '冰霜新星': {
                for (const enemy of enemies) {
                    if (!enemy.isDead && dist(this.x, this.y, enemy.x, enemy.y) < 100) {
                        const { damage, crit } = calcDamage(this.atk * 1.2, enemy.def, this.crit, this.critMult);
                        result.effects.push({ enemy, damage, crit, freeze: true });
                    }
                }
                break;
            }
            case '荆棘光环': {
                this.thornsTimer = 10;
                result.effects.push({ buff: 'thorns' });
                break;
            }
            default: {
                // Generic damage skill
                for (const enemy of enemies) {
                    if (!enemy.isDead && dist(this.x, this.y, enemy.x, enemy.y) < 100) {
                        const { damage, crit } = calcDamage(this.atk * 1.3, enemy.def, this.crit, this.critMult);
                        result.effects.push({ enemy, damage, crit });
                    }
                }
            }
        }
        return result;
    }

    dash() {
        if (this.dashCooldown > 0 || this.isDashing) return false;
        this.isDashing = true;
        this.dashDir = { x: Math.cos(this.facingAngle), y: Math.sin(this.facingAngle) };
        this.dashTimer = 0.15;
        this.dashCooldown = 1.5;
        this.invincibleTimer = 0.15;
        return true;
    }

    // ─── Update ───
    update(dt, input, dungeon) {
        // Timers
        this.attackTimer = Math.max(0, this.attackTimer - dt);
        this.invincibleTimer = Math.max(0, this.invincibleTimer - dt);
        this.dashCooldown = Math.max(0, this.dashCooldown - dt);
        this.hitFlash = Math.max(0, this.hitFlash - dt);
        this.cheatDeathCooldown = Math.max(0, this.cheatDeathCooldown - dt);
        this.berserkTimer = Math.max(0, this.berserkTimer - dt);
        this.thornsTimer = Math.max(0, this.thornsTimer - dt);
        this.animTimer += dt;

        // Cooldowns
        for (const key of Object.keys(this.skillCooldowns)) {
            this.skillCooldowns[key] = Math.max(0, this.skillCooldowns[key] - dt);
        }

        // Regen
        this.regenMana(dt);
        this.regenHp(dt);

        // Dash movement
        if (this.isDashing) {
            this.dashTimer -= dt;
            const dashSpd = 600;
            this.x += this.dashDir.x * dashSpd * dt;
            this.y += this.dashDir.y * dashSpd * dt;
            if (this.dashTimer <= 0) this.isDashing = false;
        } else {
            let mx = 0, my = 0;
            if (input.keys['KeyW'] || input.keys['ArrowUp']) my -= 1;
            if (input.keys['KeyS'] || input.keys['ArrowDown']) my += 1;
            if (input.keys['KeyA'] || input.keys['ArrowLeft']) mx -= 1;
            if (input.keys['KeyD'] || input.keys['ArrowRight']) mx += 1;

            if (mx !== 0 || my !== 0) {
                const len = Math.sqrt(mx * mx + my * my);
                mx /= len;
                my /= len;
                this.facingAngle = Math.atan2(my, mx);
            }

            this.x += mx * this.spd * dt;
            this.y += my * this.spd * dt;
        }

        // Wall collision
        if (dungeon) this.resolveWallCollision(dungeon);
        if (dungeon) {
            this.x = clamp(this.x, 16, dungeon.pixelWidth - 16);
            this.y = clamp(this.y, 16, dungeon.pixelHeight - 16);
        }
    }

    resolveWallCollision(dungeon) {
        const r = this.radius;
        for (const wall of dungeon.wallRects) {
            if (this.x + r > wall.x && this.x - r < wall.x + wall.w &&
                this.y + r > wall.y && this.y - r < wall.y + wall.h) {
                const cx = this.x, cy = this.y;
                const left = (cx + r) - wall.x;
                const right = (wall.x + wall.w) - (cx - r);
                const top = (cy + r) - wall.y;
                const bottom = (wall.y + wall.h) - (cy - r);
                const min = Math.min(left, right, top, bottom);
                if (min === left) this.x = wall.x - r;
                else if (min === right) this.x = wall.x + wall.w + r;
                else if (min === top) this.y = wall.y - r;
                else this.y = wall.y + wall.h + r;
            }
        }
    }
}


const TILE = 32;
const GRID_COLS = 6;
const GRID_ROWS = 6;
const ROOM_SPACING = 340; // pixels between grid cells (fits max 9-tile room + corridor space)
const MIN_ROOM_SIZE = 5; // in tiles
const MAX_ROOM_SIZE = 5;

const ROOM_TYPES = {
    START:    'start',
    BATTLE:   'battle',
    TREASURE: 'treasure',
    BOSS:     'boss',
    SHOP:     'shop'
};

class Room {
    constructor(gridX, gridY, tileW, tileH) {
        this.gridX = gridX;
        this.gridY = gridY;
        this.tileW = tileW;
        this.tileH = tileH;
        this.px = gridX * ROOM_SPACING + rand(0, 40);
        this.py = gridY * ROOM_SPACING + rand(0, 40);
        this.pw = tileW * TILE;
        this.ph = tileH * TILE;
        this.cx = this.px + this.pw / 2;
        this.cy = this.py + this.ph / 2;
        this.type = ROOM_TYPES.BATTLE;
        this.doors = { top: false, bottom: false, left: false, right: false };
        this.cleared = false;
        this.enemies = [];
        this.visited = false;
        this.id = `room_${gridX}_${gridY}`;
    }

    containsPoint(x, y) {
        return x >= this.px && x <= this.px + this.pw &&
               y >= this.py && y <= this.py + this.ph;
    }

    get randomPosition() {
        const margin = 40;
        return {
            x: this.px + margin + Math.random() * (this.pw - margin * 2),
            y: this.py + margin + Math.random() * (this.ph - margin * 2)
        };
    }
}

class Dungeon {
    constructor(floor = 1) {
        this.floor = floor;
        this.rooms = [];
        this.corridors = [];
        this.wallRects = [];
        this.gridCols = GRID_COLS;
        this.gridRows = GRID_ROWS;
        this.pixelWidth = GRID_COLS * ROOM_SPACING + MAX_ROOM_SIZE * TILE;
        this.pixelHeight = GRID_ROWS * ROOM_SPACING + MAX_ROOM_SIZE * TILE;
        this.startRoom = null;
        this.bossRoom = null;
        this.generate();
    }

    generate() {
        this.rooms = [];
        this.corridors = [];
        this.wallRects = [];

        // Generate rooms on a grid with random sizes
        const grid = [];
        for (let gy = 0; gy < GRID_ROWS; gy++) {
            grid[gy] = [];
            for (let gx = 0; gx < GRID_COLS; gx++) {
                // Randomly skip some grid cells
                if (Math.random() < 0.25) {
                    grid[gy][gx] = null;
                    continue;
                }
                const tw = rand(MIN_ROOM_SIZE, MAX_ROOM_SIZE);
                const th = rand(MIN_ROOM_SIZE, MAX_ROOM_SIZE);
                grid[gy][gx] = new Room(gx, gy, tw, th);
                this.rooms.push(grid[gy][gx]);
            }
        }

        // Ensure at least 6 rooms
        while (this.rooms.length < 6) {
            const gx = rand(0, GRID_COLS - 1);
            const gy = rand(0, GRID_ROWS - 1);
            if (!grid[gy][gx]) {
                const tw = rand(MIN_ROOM_SIZE, MAX_ROOM_SIZE);
                const th = rand(MIN_ROOM_SIZE, MAX_ROOM_SIZE);
                grid[gy][gx] = new Room(gx, gy, tw, th);
                this.rooms.push(grid[gy][gx]);
            }
        }

        // Connect rooms with corridors (minimum spanning tree + extra connections)
        const edges = [];
        for (let i = 0; i < this.rooms.length; i++) {
            for (let j = i + 1; j < this.rooms.length; j++) {
                const d = dist(this.rooms[i].cx, this.rooms[i].cy, this.rooms[j].cx, this.rooms[j].cy);
                edges.push({ i, j, d });
            }
        }
        edges.sort((a, b) => a.d - b.d);

        // Union-find for MST
        const parent = Array.from({ length: this.rooms.length }, (_, i) => i);
        const find = (x) => parent[x] === x ? x : (parent[x] = find(parent[x]));
        const union = (a, b) => { parent[find(a)] = find(b); };

        const mstEdges = [];
        for (const e of edges) {
            if (find(e.i) !== find(e.j)) {
                union(e.i, e.j);
                mstEdges.push(e);
            }
        }

        // Add some extra connections
        const extraCount = Math.floor(this.rooms.length * 0.3);
        for (const e of edges) {
            if (extraCount <= 0) break;
            if (!mstEdges.includes(e)) {
                mstEdges.push(e);
            }
        }

        // Build corridors
        for (const e of mstEdges) {
            const a = this.rooms[e.i];
            const b = this.rooms[e.j];
            this.addCorridor(a, b);
        }

        // Set room types
        this.startRoom = this.rooms[0] || this.rooms.find(r => r);
        this.startRoom.type = ROOM_TYPES.START;
        this.startRoom.cleared = true;
        this.startRoom.visited = true;

        // Find farthest room for boss
        let maxDist = 0;
        let bossCandidate = this.rooms[1] || this.rooms[0];
        for (const r of this.rooms) {
            if (r === this.startRoom) continue;
            const d = dist(this.startRoom.cx, this.startRoom.cy, r.cx, r.cy);
            if (d > maxDist) { maxDist = d; bossCandidate = r; }
        }
        this.bossRoom = bossCandidate;
        this.bossRoom.type = ROOM_TYPES.BOSS;

        // Treasure room
        const others = this.rooms.filter(r => r !== this.startRoom && r !== this.bossRoom);
        if (others.length > 0) {
            const treasure = choice(others);
            if (treasure) treasure.type = ROOM_TYPES.TREASURE;
        }

        if (others.length > 1) {
            const shopCandidate = others.find(r => r.type === ROOM_TYPES.BATTLE);
            if (shopCandidate) shopCandidate.type = ROOM_TYPES.SHOP;
        }

        // Calculate wall rects for collision
        this.calculateWalls();
    }

    addCorridor(a, b) {
        // L-shaped corridor
        const midX = a.cx;
        const midY = b.cy;
        this.corridors.push({ x1: a.cx, y1: a.cy, x2: midX, y2: a.cy });
        this.corridors.push({ x1: midX, y1: a.cy, x2: midX, y2: b.cy });
        this.corridors.push({ x1: midX, y1: b.cy, x2: b.cx, y2: b.cy });

        // Set doors based on corridor geometry (vertical from a, then horizontal into b)
        if (b.cy > a.cy) {
            a.doors.bottom = true;
        } else {
            a.doors.top = true;
        }
        if (b.cx > a.cx) {
            b.doors.left = true;
        } else {
            b.doors.right = true;
        }
    }

    calculateWalls() {
        // Build a bitmap of walkable tiles
        const cols = Math.ceil(this.pixelWidth / TILE);
        const rows = Math.ceil(this.pixelHeight / TILE);
        const walkable = Array.from({ length: rows }, () => Array(cols).fill(false));

        // Mark rooms as walkable (with 1-tile border as wall)
        for (const room of this.rooms) {
            const rx = Math.floor(room.px / TILE);
            const ry = Math.floor(room.py / TILE);
            const rw = Math.floor(room.pw / TILE);
            const rh = Math.floor(room.ph / TILE);
            // Interior is walkable
            for (let y = ry + 1; y < ry + rh - 1; y++) {
                for (let x = rx + 1; x < rx + rw - 1; x++) {
                    if (y >= 0 && y < rows && x >= 0 && x < cols) {
                        walkable[y][x] = true;
                    }
                }
            }
            // Door openings
            if (room.doors.top) {
                const dx = Math.floor(room.cx / TILE);
                const dy = ry;
                if (dy >= 0 && dy < rows && dx >= 0 && dx < cols) walkable[dy][dx] = true;
                if (dy + 1 < rows) walkable[dy + 1][dx] = true;
            }
            if (room.doors.bottom) {
                const dx = Math.floor(room.cx / TILE);
                const dy = ry + rh - 2;
                if (dy >= 0 && dy < rows && dx >= 0 && dx < cols) walkable[dy][dx] = true;
                if (dy + 1 < rows) walkable[dy + 1][dx] = true;
            }
            if (room.doors.left) {
                const dx = rx;
                const dy = Math.floor(room.cy / TILE);
                if (dy >= 0 && dy < rows && dx >= 0 && dx < cols) walkable[dy][dx] = true;
                if (dx + 1 < cols) walkable[dy][dx + 1] = true;
            }
            if (room.doors.right) {
                const dx = rx + rw - 2;
                const dy = Math.floor(room.cy / TILE);
                if (dy >= 0 && dy < rows && dx >= 0 && dx < cols) walkable[dy][dx] = true;
                if (dx + 1 < cols) walkable[dy][dx + 1] = true;
            }
        }

        // Mark corridors as walkable
        for (const cor of this.corridors) {
            const sx = Math.floor(Math.min(cor.x1, cor.x2) / TILE);
            const ex = Math.floor(Math.max(cor.x1, cor.x2) / TILE);
            const sy = Math.floor(Math.min(cor.y1, cor.y2) / TILE);
            const ey = Math.floor(Math.max(cor.y1, cor.y2) / TILE);
            for (let y = sy; y <= ey; y++) {
                for (let x = sx; x <= ex; x++) {
                    if (y >= 0 && y < rows && x >= 0 && x < cols) {
                        walkable[y][x] = true;
                    }
                }
            }
        }

        // Extract wall rects (adjacent non-walkable tiles grouped)
        this.walkableGrid = walkable;

        // For collision, generate wall segments from room perimeters with door gaps
        this.wallRects = [];
        for (const room of this.rooms) {
            const rx = room.px, ry = room.py, rw = room.pw, rh = room.ph;
            const wt = 8; // wall thickness
            const doorW = 32; // door opening width
            const doorCenterX = room.cx;
            const doorCenterY = room.cy;

            // Top wall
            if (room.doors.top) {
                const leftW = doorCenterX - doorW / 2 - rx;
                const rightStart = doorCenterX + doorW / 2;
                if (leftW > 0) this.wallRects.push({ x: rx, y: ry, w: leftW, h: wt });
                if (rightStart < rx + rw) this.wallRects.push({ x: rightStart, y: ry, w: rx + rw - rightStart, h: wt });
            } else {
                this.wallRects.push({ x: rx, y: ry, w: rw, h: wt });
            }
            // Bottom wall
            if (room.doors.bottom) {
                const leftW = doorCenterX - doorW / 2 - rx;
                const rightStart = doorCenterX + doorW / 2;
                if (leftW > 0) this.wallRects.push({ x: rx, y: ry + rh - wt, w: leftW, h: wt });
                if (rightStart < rx + rw) this.wallRects.push({ x: rightStart, y: ry + rh - wt, w: rx + rw - rightStart, h: wt });
            } else {
                this.wallRects.push({ x: rx, y: ry + rh - wt, w: rw, h: wt });
            }
            // Left wall
            if (room.doors.left) {
                const topH = doorCenterY - doorW / 2 - ry;
                const bottomStart = doorCenterY + doorW / 2;
                if (topH > 0) this.wallRects.push({ x: rx, y: ry, w: wt, h: topH });
                if (bottomStart < ry + rh) this.wallRects.push({ x: rx, y: bottomStart, w: wt, h: ry + rh - bottomStart });
            } else {
                this.wallRects.push({ x: rx, y: ry, w: wt, h: rh });
            }
            // Right wall
            if (room.doors.right) {
                const topH = doorCenterY - doorW / 2 - ry;
                const bottomStart = doorCenterY + doorW / 2;
                if (topH > 0) this.wallRects.push({ x: rx + rw - wt, y: ry, w: wt, h: topH });
                if (bottomStart < ry + rh) this.wallRects.push({ x: rx + rw - wt, y: bottomStart, w: wt, h: ry + rh - bottomStart });
            } else {
                this.wallRects.push({ x: rx + rw - wt, y: ry, w: wt, h: rh });
            }
        }

    }

    getRoomAt(x, y) {
        return this.rooms.find(r => r.containsPoint(x, y)) || null;
    }

    isWalkable(x, y) {
        const tx = Math.floor(x / TILE);
        const ty = Math.floor(y / TILE);
        if (ty < 0 || ty >= this.walkableGrid.length) return false;
        if (tx < 0 || tx >= this.walkableGrid[0].length) return false;
        return this.walkableGrid[ty][tx];
    }
}



// AI states
const AI = { IDLE: 'idle', PATROL: 'patrol', CHASE: 'chase', ATTACK: 'attack', DEAD: 'dead' };

class Enemy {
    constructor(x, y, config) {
        this.x = x;
        this.y = y;
        this.radius = config.radius || 12;
        this.name = config.name || 'Enemy';
        this.type = config.type || 'slime';
        this.maxHp = config.hp || 30;
        this.hp = this.maxHp;
        this.atk = config.atk || 5;
        this.def = config.def || 2;
        this.spd = config.spd || 60;
        this.xpReward = config.xpReward || 10;
        this.goldReward = config.goldReward || rand(3, 8);

        this.state = AI.IDLE;
        this.stateTimer = 0;
        this.patrolTarget = { x, y };
        this.attackCooldown = 0;
        this.attackRange = config.attackRange || 30;
        this.chaseRange = config.chaseRange || 200;
        this.attackSpeed = config.attackSpeed || 1.5;
        this.projectiles = [];
        this.isRanged = config.isRanged || false;
        this.projectileSpeed = config.projectileSpeed || 200;
        this.color = config.color || '#4a4';
        this.hitFlash = 0;
        this.animTimer = randFloat(0, Math.PI * 2);
        this.isBoss = config.isBoss || false;
    }

    get isDead() { return this.hp <= 0; }

    takeDamage(amount) {
        this.hp -= amount;
        this.hitFlash = 0.12;
        if (this.isDead) {
            this.state = AI.DEAD;
            return true; // died
        }
        return false;
    }

    update(dt, player, dungeon) {
        if (this.isDead) {
            // Update remaining projectiles
            for (const p of this.projectiles) {
                updateProjectile(p, dt);
            }
            this.projectiles = this.projectiles.filter(p => p.active);
            return;
        }

        this.animTimer += dt;
        this.attackCooldown = Math.max(0, this.attackCooldown - dt);
        this.hitFlash = Math.max(0, this.hitFlash - dt);
        this.stateTimer -= dt;

        const d = dist(this.x, this.y, player.x, player.y);

        // State machine
        switch (this.state) {
            case AI.IDLE:
                if (d < this.chaseRange) {
                    this.state = AI.CHASE;
                } else if (this.stateTimer <= 0) {
                    this.state = AI.PATROL;
                    this.patrolTarget = {
                        x: this.x + rand(-60, 60),
                        y: this.y + rand(-60, 60)
                    };
                    this.stateTimer = rand(1, 3);
                }
                break;

            case AI.PATROL:
                const pd = dist(this.x, this.y, this.patrolTarget.x, this.patrolTarget.y);
                if (pd < 10 || this.stateTimer <= 0) {
                    this.state = AI.IDLE;
                    this.stateTimer = rand(1, 2);
                } else {
                    this.moveToward(this.patrolTarget.x, this.patrolTarget.y, this.spd * 0.4, dt);
                }
                if (d < this.chaseRange) this.state = AI.CHASE;
                break;

            case AI.CHASE:
                if (d > this.chaseRange * 1.5) {
                    this.state = AI.IDLE;
                    this.stateTimer = rand(1, 3);
                } else if (d <= this.attackRange) {
                    this.state = AI.ATTACK;
                } else {
                    this.moveToward(player.x, player.y, this.spd, dt);
                }
                break;

            case AI.ATTACK:
                if (d > this.attackRange * 1.3) {
                    this.state = AI.CHASE;
                } else if (this.attackCooldown <= 0) {
                    this.attackCooldown = this.attackSpeed;
                    return this.performAttack(player);
                }
                // Strafe slightly
                if (this.isRanged && d < this.attackRange * 0.5) {
                    const a = angle(player.x, player.y, this.x, this.y);
                    this.x += Math.cos(a) * this.spd * 0.5 * dt;
                    this.y += Math.sin(a) * this.spd * 0.5 * dt;
                }
                break;
        }

        // Update projectiles
        for (const p of this.projectiles) {
            updateProjectile(p, dt);
        }
        this.projectiles = this.projectiles.filter(p => p.active);

        return null; // No attack this frame
    }

    moveToward(tx, ty, speed, dt) {
        const a = angle(this.x, this.y, tx, ty);
        this.x += Math.cos(a) * speed * dt;
        this.y += Math.sin(a) * speed * dt;
    }

    performAttack(player) {
        if (this.isRanged) {
            const p = createProjectile(
                this.x, this.y, player.x, player.y,
                this.projectileSpeed, this.atk,
                this.color === '#4a4' ? '#a4f' : '#f44', 4
            );
            this.projectiles.push(p);
            return { type: 'ranged', projectile: p };
        } else {
            const { damage, crit } = calcDamage(this.atk, player.def, 0.05);
            return { type: 'melee', damage, crit };
        }
    }

    getAttackDamage(player) {
        if (dist(this.x, this.y, player.x, player.y) > this.attackRange + 8) return null;
        const { damage, crit } = calcDamage(this.atk, player.def, 0.05);
        return { type: 'melee', damage, crit };
    }
}
