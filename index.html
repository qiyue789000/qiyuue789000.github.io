<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深渊探索者 - 肉鸽地牢</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer">
            <div id="hud"></div>
            <div id="level-up-notify"></div>
            <div id="floor-indicator"></div>
            <div id="inventory-panel"></div>
            <div id="shop-panel"></div>
            <div id="game-over-screen"></div>
            <div id="equip-bar"></div>
            <div id="tutorial-overlay">
                <div id="tutorial-card">
                    <div id="tutorial-icon"></div>
                    <h2 id="tutorial-title"></h2>
                    <p id="tutorial-text"></p>
                    <div id="tutorial-hint"></div>
                    <div id="tutorial-progress"></div>
                    <div id="tutorial-buttons">
                        <button id="tutorial-prev">上一步</button>
                        <button id="tutorial-next">下一步</button>
                        <button id="tutorial-skip">跳过教程</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
