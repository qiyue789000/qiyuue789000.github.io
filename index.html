// Choose enemies for a room based on type and floor
function spawnEnemiesForRoom(room, floor) {
    const enemies = [];
    const pos = room.randomPosition;

    switch (room.type) {
        case 'battle': {
            const count = rand(2, 3 + Math.floor(floor / 3));
            for (let i = 0; i < count; i++) {
                const p = room.randomPosition;
                const roll = Math.random();
                if (roll < 0.35) enemies.push(createSlime(p.x, p.y, floor));
                else if (roll < 0.65) enemies.push(createSkeleton(p.x, p.y, floor));
                else if (roll < 0.85) enemies.push(createShadowMage(p.x, p.y, floor));
                else enemies.push(createStoneGolem(p.x, p.y, floor));
            }
            break;
        }
        case 'treasure': {
            // 1-2 tougher enemies guarding treasure
            const count = rand(1, 2);
            for (let i = 0; i < count; i++) {
                const p = room.randomPosition;
                enemies.push(createStoneGolem(p.x, p.y, floor));
            }
            break;
        }
        case 'boss': {
            const p = room.randomPosition;
            enemies.push(createBoss(p.x, p.y, floor));
            // Add some minions
            for (let i = 0; i < 2; i++) {
                const mp = room.randomPosition;
                enemies.push(createSkeleton(mp.x, mp.y, floor));
            }
            break;
        }
        case 'shop':
            // No enemies in shop
            break;
        case 'start':
            // No enemies in start room
            break;
    }

    room.enemies = enemies;
    return enemies;
}


const TILE = 32;

class Renderer {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.width = canvas.width;
        this.height = canvas.height;
        this.camera = { x: 0, y: 0, w: canvas.width, h: canvas.height };
        this.shakeIntensity = 0;
        this.shakeTimer = 0;
        this.screenFlash = 0;
        this.screenFlashColor = '#fff';
    }

    screenShake(intensity = 4, duration = 0.2) {
        this.shakeIntensity = Math.max(this.shakeIntensity, intensity);
        this.shakeTimer = Math.max(this.shakeTimer, duration);
    }

    flashScreen(color = '#fff', duration = 0.08) {
        this.screenFlash = duration;
        this.screenFlashColor = color;
    }

    updateCamera(player) {
        this.camera.x = player.x - this.width / 2;
        this.camera.y = player.y - this.height / 2;
        if (this.shakeTimer > 0) {
            this.camera.x += (Math.random() - 0.5) * this.shakeIntensity * 2;
            this.camera.y += (Math.random() - 0.5) * this.shakeIntensity * 2;
        }
    }

    update(dt) {
        if (this.shakeTimer > 0) {
            this.shakeTimer -= dt;
            if (this.shakeTimer <= 0) this.shakeIntensity = 0;
        }
        if (this.screenFlash > 0) this.screenFlash -= dt;
    }

    get sx() { return this.camera.x; }
    get sy() { return this.camera.y; }

    clear() {
        this.ctx.fillStyle = '#0d0d0d';
        this.ctx.fillRect(0, 0, this.width, this.height);
    }

    drawDungeon(dungeon) {
        const ctx = this.ctx;
        const cx = this.sx, cy = this.sy;

        // Draw floor pattern (grid)
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 0.5;
        const startTX = Math.floor(cx / TILE) * TILE;
        const startTY = Math.floor(cy / TILE) * TILE;
        for (let y = startTY; y < cy + this.height + TILE; y += TILE) {
            for (let x = startTX; x < cx + this.width + TILE; x += TILE) {
                ctx.strokeRect(x - cx, y - cy, TILE, TILE);
            }
        }

        // Draw rooms
        for (const room of dungeon.rooms) {
            const rx = room.px - cx;
            const ry = room.py - cy;

            if (!room.visited) continue;

            // Room floor
            let floorColor = '#1a1a2e';
            if (room.type === ROOM_TYPES.START) floorColor = '#1a2e1a';
            else if (room.type === ROOM_TYPES.BOSS) floorColor = '#2e1a1a';
            else if (room.type === ROOM_TYPES.TREASURE) floorColor = '#2e2a1a';
            else if (room.type === ROOM_TYPES.SHOP) floorColor = '#1a2e2e';

            ctx.fillStyle = floorColor;
            ctx.fillRect(rx, ry, room.pw, room.ph);

            // Room border
            ctx.strokeStyle = room.visited ? '#444' : '#222';
            ctx.lineWidth = 2;
            ctx.strokeRect(rx, ry, room.pw, room.ph);

            // Doors
            const doorSize = 24;
            ctx.fillStyle = '#2a1a0a';
            if (room.doors.top) {
                const dx = room.cx - cx - doorSize / 2;
                ctx.fillRect(dx, ry - 4, doorSize, 12);
            }
            if (room.doors.bottom) {
                const dx = room.cx - cx - doorSize / 2;
                ctx.fillRect(dx, ry + room.ph - 8, doorSize, 12);
            }
            if (room.doors.left) {
                const dy = room.cy - cy - doorSize / 2;
                ctx.fillRect(rx - 4, dy, 12, doorSize);
            }
            if (room.doors.right) {
                const dy = room.cy - cy - doorSize / 2;
                ctx.fillRect(rx + room.pw - 8, dy, 12, doorSize);
            }

            // Room type icon
            if (room.visited) {
                ctx.font = '16px serif';
                ctx.textAlign = 'center';
                let icon = '';
                if (room.type === ROOM_TYPES.START) icon = '🏠';
                else if (room.type === ROOM_TYPES.BOSS) icon = '💀';
                else if (room.type === ROOM_TYPES.TREASURE) icon = '📦';
                else if (room.type === ROOM_TYPES.SHOP) icon = '🏪';
                if (icon && !room.cleared && room.type !== ROOM_TYPES.START) {
                    ctx.fillText(icon, room.cx - cx, room.py - cy + 24);
                }
            }
        }

        // Draw corridors
        ctx.strokeStyle = '#2a2a1a';
        ctx.lineWidth = 20;
        ctx.lineCap = 'round';
        for (const cor of dungeon.corridors) {
            ctx.beginPath();
            ctx.moveTo(cor.x1 - cx, cor.y1 - cy);
            ctx.lineTo(cor.x2 - cx, cor.y2 - cy);
            ctx.stroke();
        }
        ctx.lineWidth = 16;
        ctx.strokeStyle = '#1a1a2e';
        for (const cor of dungeon.corridors) {
            ctx.beginPath();
            ctx.moveTo(cor.x1 - cx, cor.y1 - cy);
            ctx.lineTo(cor.x2 - cx, cor.y2 - cy);
            ctx.stroke();
        }
        ctx.lineWidth = 1;
        ctx.lineCap = 'butt';
    }

    // Detect weapon visual type from name
    _getWeaponType(player) {
        const wp = player.equipment.weapon;
        if (!wp) return 'sword';
        const n = wp.name;
        if (n.includes('短剑') || n.includes('长剑') || n.includes('匕首')) return 'sword';
        if (n.includes('战斧') || n.includes('巨锤')) return 'heavy';
        if (n.includes('魔杖')) return 'wand';
        if (n.includes('镰刀')) return 'scythe';
        if (n.includes('拳套')) return 'fist';
        return 'sword';
    }

    _getArmorColor(player) {
        const ar = player.equipment.armor;
        if (!ar) return '#3498db';
        const map = { COMMON: '#8899aa', RARE: '#5dade2', EPIC: '#a569bd', LEGENDARY: '#e67e22' };
        return map[ar.rarity] || '#3498db';
    }

    _getArmorGlow(player) {
        const ar = player.equipment.armor;
        if (!ar) return null;
        if (ar.rarity === 'LEGENDARY') return { color: '#e67e22', size: 6, alpha: 0.3 };
        if (ar.rarity === 'EPIC') return { color: '#a569bd', size: 4, alpha: 0.2 };
        return null;
    }

    drawPlayer(player) {
        const ctx = this.ctx;
        const px = player.x - this.sx;
        const py = player.y - this.sy;
        const r = player.radius;
        const a = player.facingAngle;

        if (px < -60 || px > this.width + 60 || py < -60 || py > this.height + 60) return;

        // ─── Shadow ───
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath();
        ctx.ellipse(px, py + r * 0.55, r * 0.75, r * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Invincibility flicker
        if (player.invincibleTimer > 0 && Math.floor(player.invincibleTimer * 20) % 2 === 0) {
            ctx.globalAlpha = 0.4;
        }

        const hitColor = player.hitFlash > 0;
        const armorColor = this._getArmorColor(player);
        const weaponType = this._getWeaponType(player);
        const bodyColor = hitColor ? '#fff' : armorColor;

        // ─── Ring glow aura ───
        const ring = player.equipment.ring;
        if (ring && !hitColor) {
            const ringColors = { COMMON: 'rgba(170,170,170,0.15)', RARE: 'rgba(52,152,219,0.2)', EPIC: 'rgba(155,89,182,0.25)', LEGENDARY: 'rgba(230,126,34,0.35)' };
            ctx.fillStyle = ringColors[ring.rarity] || 'rgba(255,255,255,0.1)';
            ctx.beginPath();
            ctx.arc(px, py, r + 7 + Math.sin(Date.now() / 500) * 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // ─── Armor glow ───
        const glow = this._getArmorGlow(player);
        if (glow && !hitColor) {
            ctx.fillStyle = glow.color.replace(')', `,${glow.alpha})`).replace('rgb', 'rgba');
            if (glow.color.startsWith('#')) {
                ctx.fillStyle = glow.color + '4d';
            }
            ctx.beginPath();
            ctx.arc(px, py, r + glow.size + Math.sin(Date.now() / 400) * 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // ─── Body ───
        ctx.fillStyle = bodyColor;
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = hitColor ? '#f44' : '#1a1a2e';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Inner highlight
        const grad = ctx.createRadialGradient(px - r * 0.3, py - r * 0.3, r * 0.1, px, py, r);
        grad.addColorStop(0, 'rgba(255,255,255,0.2)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();

        // ─── Helmet ───
        const helm = player.equipment.helmet;
        if (helm) {
            const helmColors = { COMMON: '#999', RARE: '#5dade2', EPIC: '#a569bd', LEGENDARY: '#e67e22' };
            const hc = helmColors[helm.rarity] || '#888';
            ctx.fillStyle = hitColor ? '#fff' : hc;
            // Helmet dome
            ctx.beginPath();
            ctx.arc(px, py - r * 0.25, r * 0.7, Math.PI, 0);
            ctx.fill();
            ctx.fillRect(px - r * 0.7, py - r * 0.25, r * 1.4, r * 0.15);
            // Visor slit
            ctx.fillStyle = '#111';
            ctx.fillRect(px - r * 0.5, py - r * 0.35, r, r * 0.08);
            ctx.fillStyle = hitColor ? '#fff' : hc;
        }

        // ─── Eyes ───
        const ex = Math.cos(a) * 4;
        const ey = Math.sin(a) * 4;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(px + ex - 3, py + ey - 3, 3.5, 0, Math.PI * 2);
        ctx.arc(px + ex + 3, py + ey - 3, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(px + ex - 2.5, py + ey - 2.5, 1.8, 0, Math.PI * 2);
        ctx.arc(px + ex + 3.5, py + ey - 2.5, 1.8, 0, Math.PI * 2);
        ctx.fill();

        // ─── Weapon ───
        const weapon = player.equipment.weapon;
        const wpColor = weapon ? ({ COMMON: '#ccc', RARE: '#5dade2', EPIC: '#bb8fce', LEGENDARY: '#f39c12' }[weapon.rarity] || '#ddd') : '#ddd';
        const wx = px + Math.cos(a) * (r + 2);
        const wy = py + Math.sin(a) * (r + 2);

        if (weaponType === 'sword' || weaponType === 'heavy' || weaponType === 'scythe') {
            // Blade
            const bladeLen = weaponType === 'heavy' ? r * 1.6 : r * 1.3;
            const tipX = px + Math.cos(a) * (r + bladeLen);
            const tipY = py + Math.sin(a) * (r + bladeLen);
            ctx.strokeStyle = hitColor ? '#fff' : wpColor;
            ctx.lineWidth = weaponType === 'heavy' ? 5 : 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(wx, wy);
            ctx.lineTo(tipX, tipY);
            ctx.stroke();
            // Cross guard
            const gx1 = px + Math.cos(a + Math.PI / 2) * 6;
            const gy1 = py + Math.sin(a + Math.PI / 2) * 6;
            const gx2 = px + Math.cos(a - Math.PI / 2) * 6;
            const gy2 = py + Math.sin(a - Math.PI / 2) * 6;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(gx1, gy1);
            ctx.lineTo(gx2, gy2);
            ctx.stroke();
            ctx.lineCap = 'butt';
        } else if (weaponType === 'fist') {
            // Gauntlet
            ctx.fillStyle = hitColor ? '#fff' : wpColor;
            const fx = px + Math.cos(a) * (r + 6);
            const fy = py + Math.sin(a) * (r + 6);
            ctx.beginPath();
            ctx.arc(fx, fy, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.stroke();
        } else if (weaponType === 'wand') {
            // Wand with glowing tip
            ctx.strokeStyle = hitColor ? '#fff' : '#8B4513';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(wx, wy);
            const wandTipX = px + Math.cos(a) * (r + r * 1.2);
            const wandTipY = py + Math.sin(a) * (r + r * 1.2);
            ctx.lineTo(wandTipX, wandTipY);
            ctx.stroke();
            // Glowing orb
            const orbGlow = ctx.createRadialGradient(wandTipX, wandTipY, 1, wandTipX, wandTipY, 6);
            orbGlow.addColorStop(0, wpColor);
            orbGlow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = orbGlow;
            ctx.beginPath();
            ctx.arc(wandTipX, wandTipY, 6 + Math.sin(Date.now() / 200) * 1.5, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.globalAlpha = 1;
        ctx.lineWidth = 1;

        // ─── Dash trail ───
        if (player.isDashing) {
            for (let i = 1; i <= 4; i++) {
                const tx = px - player.dashDir.x * i * 12;
                const ty = py - player.dashDir.y * i * 12;
                ctx.fillStyle = `rgba(52,152,219,${0.35 - i * 0.07})`;
                ctx.beginPath();
                ctx.arc(tx, ty, r * (1 - i * 0.15), 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    // ─── Attack slash arc ───
    drawAttackSlash(player) {
        if (player.attackTimer < player.attackSpeed - 0.05) return; // only show right after attack
        const ctx = this.ctx;
        const px = player.x - this.sx;
        const py = player.y - this.sy;
        const a = player.facingAngle;
        const r = player.radius;
        const weaponType = this._getWeaponType(player);
        const progress = 1 - (player.attackTimer / player.attackSpeed);

        ctx.save();
        ctx.globalAlpha = 1 - progress;

        const slashDist = r + 20 + progress * 25;
        const arcWidth = weaponType === 'heavy' ? 1.2 : 0.7;

        if (weaponType === 'heavy') {
            // Wide heavy arc
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4 * (1 - progress);
            ctx.shadowColor = '#f39c12';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(px, py, slashDist, a - arcWidth, a + arcWidth);
            ctx.stroke();
            // Inner arc
            ctx.strokeStyle = '#f39c12';
            ctx.lineWidth = 2 * (1 - progress);
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(px, py, slashDist, a - arcWidth * 0.6, a + arcWidth * 0.6);
            ctx.stroke();
        } else if (weaponType === 'scythe') {
            // Curved slash
            ctx.strokeStyle = '#e8da5e';
            ctx.lineWidth = 3 * (1 - progress);
            ctx.shadowColor = '#e8da5e';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(px, py, slashDist, a - 0.5, a + 0.8);
            ctx.stroke();
            ctx.shadowBlur = 0;
        } else if (weaponType === 'fist') {
            // Burst ring
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3 * (1 - progress);
            ctx.beginPath();
            ctx.arc(px + Math.cos(a) * (r + 10), py + Math.sin(a) * (r + 10), 8 + progress * 15, 0, Math.PI * 2);
            ctx.stroke();
        } else {
            // Standard sword slash
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2.5 * (1 - progress);
            ctx.shadowColor = '#aaddff';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(px, py, slashDist, a - 0.5, a + 0.5);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        ctx.restore();
    }

    drawEnemy(enemy) {
        if (enemy.isDead) return;
        const ctx = this.ctx;
        const ex = enemy.x - this.sx;
        const ey = enemy.y - this.sy;

        // Check if on screen
        if (ex < -50 || ex > this.width + 50 || ey < -50 || ey > this.height + 50) return;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.ellipse(ex, ey + enemy.radius * 0.5, enemy.radius * 0.7, enemy.radius * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Hit flash
        const hitColor = enemy.hitFlash > 0;

        // Boss aura
        if (enemy.isBoss) {
            const auraAlpha = 0.2 + Math.sin(enemy.animTimer * 3) * 0.1;
            ctx.fillStyle = `rgba(231,76,60,${auraAlpha})`;
            ctx.beginPath();
            ctx.arc(ex, ey, enemy.radius + 12, 0, Math.PI * 2);
            ctx.fill();
        }

        switch (enemy.type) {
            case 'slime':
                this.drawSlime(ex, ey, enemy, hitColor);
                break;
            case 'skeleton':
                this.drawSkeleton(ex, ey, enemy, hitColor);
                break;
            case 'shadow_mage':
                this.drawShadowMage(ex, ey, enemy, hitColor);
                break;
            case 'stone_golem':
                this.drawStoneGolem(ex, ey, enemy, hitColor);
                break;
            case 'boss':
                this.drawBoss(ex, ey, enemy, hitColor);
                break;
        }

        // HP bar (only if damaged)
        if (enemy.hp < enemy.maxHp) {
            const barW = enemy.radius * 2;
            const barH = 3;
            const barY = ey - enemy.radius - 8;
            ctx.fillStyle = '#333';
            ctx.fillRect(ex - barW / 2, barY, barW, barH);
            const hpPct = enemy.hp / enemy.maxHp;
            const hpColor = hpPct > 0.5 ? '#2ecc71' : hpPct > 0.25 ? '#f39c12' : '#e74c3c';
            ctx.fillStyle = hpColor;
            ctx.fillRect(ex - barW / 2, barY, barW * hpPct, barH);
        }
    }

    drawSlime(ex, ey, e, hit) {
        const ctx = this.ctx;
        const bounce = Math.sin(e.animTimer * 4) * 2;
        ctx.fillStyle = hit ? '#fff' : '#4ecb71';
        ctx.beginPath();
        ctx.arc(ex, ey + bounce, e.radius, Math.PI, 0);
        ctx.arc(ex, ey + bounce + 3, e.radius, 0, Math.PI);
        ctx.fill();
        ctx.fillStyle = hit ? '#fff' : '#3aa85a';
        ctx.beginPath();
        ctx.arc(ex - 3, ey + bounce - 3, 3, 0, Math.PI * 2);
        ctx.arc(ex + 3, ey + bounce - 3, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.arc(ex - 2, ey + bounce - 3, 1.5, 0, Math.PI * 2);
        ctx.arc(ex + 4, ey + bounce - 3, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }

    drawSkeleton(ex, ey, e, hit) {
        const ctx = this.ctx;
        ctx.fillStyle = hit ? '#fff' : '#ddd';
        // Skull
        ctx.beginPath();
        ctx.arc(ex, ey - 4, e.radius * 0.6, 0, Math.PI * 2);
        ctx.fill();
        // Body
        ctx.fillRect(ex - 4, ey - 1, 8, e.radius);
        // Eyes
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(ex - 3, ey - 7, 2, 3);
        ctx.fillRect(ex + 1, ey - 7, 2, 3);
    }

    drawShadowMage(ex, ey, e, hit) {
        const ctx = this.ctx;
        const float = Math.sin(e.animTimer * 3) * 3;
        ctx.fillStyle = hit ? '#fff' : '#9b59b6';
        // Hood
        ctx.beginPath();
        ctx.moveTo(ex, ey - e.radius - 4 + float);
        ctx.lineTo(ex + e.radius, ey + e.radius * 0.5 + float);
        ctx.lineTo(ex - e.radius, ey + e.radius * 0.5 + float);
        ctx.closePath();
        ctx.fill();
        // Body
        ctx.fillRect(ex - e.radius * 0.6, ey + float, e.radius * 1.2, e.radius);
        // Glowing eyes
        ctx.fillStyle = '#e8da5e';
        ctx.beginPath();
        ctx.arc(ex - 4, ey - 4 + float, 3, 0, Math.PI * 2);
        ctx.arc(ex + 4, ey - 4 + float, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    drawStoneGolem(ex, ey, e, hit) {
        const ctx = this.ctx;
        ctx.fillStyle = hit ? '#ccc' : '#888';
        // Rectangular body
        ctx.fillRect(ex - e.radius, ey - e.radius * 0.7, e.radius * 2, e.radius * 1.8);
        // Head
        ctx.fillRect(ex - e.radius * 0.5, ey - e.radius * 1.2, e.radius, e.radius * 0.6);
        // Cracks
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(ex - 4, ey - 2);
        ctx.lineTo(ex + 2, ey + 4);
        ctx.moveTo(ex + 5, ey);
        ctx.lineTo(ex + 8, ey + 6);
        ctx.stroke();
        // Eyes
        ctx.fillStyle = '#f39c12';
        ctx.fillRect(ex - 5, ey - e.radius, 3, 3);
        ctx.fillRect(ex + 2, ey - e.radius, 3, 3);
    }

    drawBoss(ex, ey, e, hit) {
        const ctx = this.ctx;
        const pulse = Math.sin(e.animTimer * 2) * 2;
        const r = e.radius + pulse;
        ctx.fillStyle = hit ? '#fff' : '#c0392b';
        // Body
        ctx.beginPath();
        ctx.arc(ex, ey, r, 0, Math.PI * 2);
        ctx.fill();
        // Darker inner
        ctx.fillStyle = hit ? '#eee' : '#922b21';
        ctx.beginPath();
        ctx.arc(ex, ey, r * 0.7, 0, Math.PI * 2);
        ctx.fill();
        // Horns
        ctx.fillStyle = hit ? '#ddd' : '#2c3e50';
        ctx.beginPath();
        ctx.moveTo(ex - r * 0.5, ey - r * 0.6);
        ctx.lineTo(ex - r * 0.8, ey - r * 1.3);
        ctx.lineTo(ex - r * 0.3, ey - r * 0.5);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(ex + r * 0.5, ey - r * 0.6);
        ctx.lineTo(ex + r * 0.8, ey - r * 1.3);
        ctx.lineTo(ex + r * 0.3, ey - r * 0.5);
        ctx.fill();
        // Eyes
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(ex - 6, ey - 4, 5, 0, Math.PI * 2);
        ctx.arc(ex + 6, ey - 4, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(ex - 6, ey - 4, 2.5, 0, Math.PI * 2);
        ctx.arc(ex + 6, ey - 4, 2.5, 0, Math.PI * 2);
        ctx.fill();
    }

    drawProjectiles(projectiles) {
        const ctx = this.ctx;
        for (const p of projectiles) {
            if (!p.active) continue;
            const px = p.x - this.sx;
            const py = p.y - this.sy;
            if (px < -30 || px > this.width + 30 || py < -30 || py > this.height + 30) continue;

            // Trail
            const trailLen = p.size * 2;
            const trailX = px - (p.vx || 0) * 0.04;
            const trailY = py - (p.vy || 0) * 0.04;
            const trailGrad = ctx.createLinearGradient(px, py, trailX, trailY);
            trailGrad.addColorStop(0, p.color);
            trailGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = trailGrad;
            ctx.beginPath();
            ctx.arc(px, py, p.size + 1, 0, Math.PI * 2);
            ctx.fill();

            // Glow
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(px, py, p.size, 0, Math.PI * 2);
            ctx.fill();

            // Inner bright core
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(px, py, p.size * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    drawDamageNumber(x, y, amount, crit = false) {
        if (amount <= 0) return;
        const ctx = this.ctx;
        const dx = x - this.sx + (Math.random() - 0.5) * 16;
        const dy = y - this.sy - 15 - Math.random() * 10;
        ctx.save();
        if (crit) {
            ctx.font = 'bold 18px monospace';
            ctx.fillStyle = '#f1c40f';
            ctx.shadowColor = '#f1c40f';
            ctx.shadowBlur = 8;
            ctx.fillText(`${amount}!`, dx, dy);
            ctx.shadowBlur = 0;
        } else {
            ctx.font = '13px monospace';
            ctx.fillStyle = '#fff';
            ctx.fillText(`${amount}`, dx, dy);
        }
        ctx.restore();
        ctx.textAlign = 'start';
    }

    drawMinimap(dungeon, player, minimapSize = 140) {
        const ctx = this.ctx;
        const mx = this.width - minimapSize - 12;
        const my = 12;
        const scaleX = minimapSize / dungeon.pixelWidth;
        const scaleY = minimapSize / dungeon.pixelHeight;

        // Background
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(mx - 2, my - 2, minimapSize + 4, minimapSize + 4);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 1;
        ctx.strokeRect(mx - 2, my - 2, minimapSize + 4, minimapSize + 4);

        // Rooms - show all rooms
        for (const room of dungeon.rooms) {
            const rx = mx + room.px * scaleX;
            const ry = my + room.py * scaleY;
            const rw = room.pw * scaleX;
            const rh = room.ph * scaleY;
            let color = '#444';
            if (room.visited) {
                if (room === dungeon.currentRoom) color = '#3498db';
                else if (room.type === ROOM_TYPES.BOSS) color = '#e74c3c';
                else if (room.type === ROOM_TYPES.TREASURE) color = '#f1c40f';
                else if (room.type === ROOM_TYPES.START) color = '#2ecc71';
                else color = '#666';
            } else {
                if (room.type === ROOM_TYPES.BOSS) color = '#5a1a1a';
                else if (room.type === ROOM_TYPES.TREASURE) color = '#5a5010';
            }
            ctx.fillStyle = color;
            ctx.fillRect(rx, ry, Math.max(rw, 2), Math.max(rh, 2));
        }

        // Player
        const px = mx + player.x * scaleX;
        const py = my + player.y * scaleY;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    drawVignette() {
        const ctx = this.ctx;
        // Screen flash
        if (this.screenFlash > 0) {
            ctx.fillStyle = this.screenFlashColor.replace(')', `,${this.screenFlash * 3})`).replace('rgb', 'rgba');
            if (this.screenFlashColor.startsWith('#')) {
                const alpha = Math.min(0.4, this.screenFlash * 5);
                ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            }
            ctx.fillRect(0, 0, this.width, this.height);
        }
        // Vignette
        const gradient = ctx.createRadialGradient(
            this.width / 2, this.height / 2, this.width * 0.35,
            this.width / 2, this.height / 2, this.width * 0.75
        );
        gradient.addColorStop(0, 'rgba(0,0,0,0)');
        gradient.addColorStop(1, 'rgba(0,0,0,0.55)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, this.width, this.height);
    }
}



const SKILL_KEYS = ['B', 'N', 'M'];

class UI {
    constructor() {
        this.levelUpNotifyEl = document.getElementById('level-up-notify');
        this.gameOverEl = document.getElementById('game-over-screen');
        this.invPanel = document.getElementById('inventory-panel');
        this.shopPanel = document.getElementById('shop-panel');
        this.equipBarEl = document.getElementById('equip-bar');
        this.floorIndicator = document.getElementById('floor-indicator');
        this.hudEl = document.getElementById('hud');
        this.levelUpTimeout = null;
        this.floorIndicatorTimeout = null;
        this._player = null;

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyI') this.toggleInventory();
            if (e.code === 'Escape') { this.hideInventory(); this.hideShop(); }
        });
    }

    // ─── HUD ───────────────────────────────────────
    updateHUD(player, dungeon, currentRoom, fps) {
        const xpPct = player.level >= 100 ? 100 : (player.xp / player.xpToNext * 100);
        const hpPct = (player.hp / player.maxHp * 100);
        const mpPct = (player.mp / player.maxMp * 100);

        // Active skills with mana costs
        let skillsHtml = '';
        for (let i = 0; i < Math.min(player.skills.length, 3); i++) {
            const s = player.skills[i];
            const cd = player.skillCooldowns[s.name] || 0;
            const key = SKILL_KEYS[i];
            const cdStr = cd > 0 ? ` [${cd.toFixed(1)}s]` : '';
            const costStr = ` ${s.cost}魔`;
            const enoughMp = player.mp >= Math.ceil(s.cost * player.skillCostMultiplier);
            const color = cd > 0 ? '#555' : (enoughMp ? '#f1c40f' : '#e74c3c');
            skillsHtml += `<span style="color:${color}">[${key}]${s.icon}${s.name}${costStr}${cdStr}</span> `;
        }
        if (player.skills.length > 3) {
            skillsHtml += `<span style="color:#555">+${player.skills.length - 3}</span>`;
        }

        // Passive skills summary
        let passivesHtml = '';
        if (player.passives.length > 0) {
            const shown = player.passives.slice(-3);
            passivesHtml = shown.map(p => `<span style="color:#2ecc71;font-size:8px;">${p.icon}${p.name}</span>`).join(' ');
            if (player.passives.length > 3) passivesHtml += ` <span style="color:#555">+${player.passives.length-3}</span>`;
        }

        this.hudEl.innerHTML = `
            <div style="font-size:18px;font-weight:bold;">深渊探索者 Lv.${player.level}</div>
            <div style="font-size:12px;color:#888;">地下 ${dungeon.floor} 层</div>
            <div style="margin-top:3px;">
                <div class="hp-bar-bg"><div class="hp-bar-fill" style="width:${hpPct}%"></div></div>
                <span style="font-size:10px;color:#e74c3c;">❤️ ${Math.floor(player.hp)}/${player.maxHp}</span>
            </div>
            <div style="margin-top:1px;">
                <div class="mp-bar-bg"><div class="mp-bar-fill" style="width:${mpPct}%"></div></div>
                <span style="font-size:10px;color:#3498db;">💎 ${Math.floor(player.mp)}/${player.maxMp} (${player.mpRegen.toFixed(1)}/秒)</span>
            </div>
            <div style="margin-top:1px;">
                <div class="xp-bar-bg"><div class="xp-bar-fill" style="width:${xpPct}%"></div></div>
                <span style="font-size:10px;color:#f1c40f;">⭐ ${player.xp}/${player.xpToNext}</span>
            </div>
            <div style="font-size:10px;color:#888;margin-top:3px;">
                ⚔${player.atk} 🛡${player.def} 💨${Math.floor(player.spd)} 💥${Math.floor(player.crit*100)}% 🪙${player.gold}
            </div>
            <div style="font-size:9px;color:#666;margin-top:2px;">
                ${skillsHtml || '暂无技能'}
            </div>
            ${passivesHtml ? `<div style="margin-top:1px;">${passivesHtml}</div>` : ''}
            <div style="font-size:9px;color:#444;margin-top:1px;">
                [WASD]移动 [鼠标左键]攻击 [空格]翻滚 [I]背包 [B/N/M]技能 [E]互动
            </div>
            ${currentRoom && currentRoom.type === 'shop' ? '<div style="font-size:13px;color:#f1c40f;margin-top:3px;animation:pulse 1s infinite;">🏪 按 [E] 打开商店</div>' : ''}
        `;

        this.updateEquipBar(player);
    }

    // ─── Equipment Bar ─────────────────────────────
    updateEquipBar(player) {
        let html = '';
        for (const slot of SLOTS) {
            const item = player.equipment[slot];
            if (item) {
                html += `<div class="eq-slot equipped rarity-${item.rarity.toLowerCase()}" title="${item.name}: ${item.desc}">
                    <div class="eq-icon">${SLOT_ICONS[slot]}</div>
                    <div style="font-size:9px;">${item.name}</div>
                </div>`;
            } else {
                html += `<div class="eq-slot empty" title="${SLOT_NAMES[slot]}">
                    <div class="eq-icon" style="opacity:0.3;">${SLOT_ICONS[slot]}</div>
                    <div style="font-size:9px;color:#555;">${SLOT_NAMES[slot]}</div>
                </div>`;
            }
        }
        this.equipBarEl.innerHTML = html;
    }

    // ─── Level Up / Floor / Game Over ──────────────
    showLevelUp(level) {
        if (level > 100) return;
        this.levelUpNotifyEl.textContent = level === 100 ? '🏆 满级！已达巅峰！🏆' : `⬆ 升级！${level}级 ⬆`;
        this.levelUpNotifyEl.style.opacity = '1';
        if (this.levelUpTimeout) clearTimeout(this.levelUpTimeout);
        this.levelUpTimeout = setTimeout(() => {
            this.levelUpNotifyEl.style.opacity = '0';
        }, 1500);
    }

    showFloorIndicator(floor) {
        this.floorIndicator.textContent = `—— 地下 ${floor} 层 ——`;
        this.floorIndicator.style.opacity = '1';
        if (this.floorIndicatorTimeout) clearTimeout(this.floorIndicatorTimeout);
        this.floorIndicatorTimeout = setTimeout(() => {
            this.floorIndicator.style.opacity = '0';
        }, 2000);
    }

    showGameOver(player, dungeon) {
        this.gameOverEl.innerHTML = `
            <h1>你死了</h1>
            <p>达到等级: ${player.level}</p>
            <p>深入层数: 地下 ${dungeon.floor} 层</p>
            <p>收集金币: ${player.gold}</p>
            <p style="color:#888;">被动技能: ${player.passives.length}个 | 主动技能: ${player.skills.length}个</p>
            <button onclick="location.reload()">重新开始</button>
        `;
        this.gameOverEl.style.display = 'block';
    }

    hideGameOver() {
        this.gameOverEl.style.display = 'none';
    }

    // ─── Inventory ─────────────────────────────────
    toggleInventory() {
        if (this.invPanel.style.display === 'block') {
            this.hideInventory();
        } else {
            this.showInventory();
        }
    }

    showInventory(player) {
        const p = player || this._player;
        this._player = p;
        if (!p) return;

        let html = '<h3>🎒 背包与装备</h3>';

        // Equipment
        html += '<div style="margin-bottom:6px;"><b>已装备:</b></div>';
        for (const slot of SLOTS) {
            const item = p.equipment[slot];
            html += `<div class="inv-slot">
                <span class="label">${SLOT_ICONS[slot]} ${SLOT_NAMES[slot]}</span>
                <span class="${item ? 'rarity-' + item.rarity.toLowerCase() : ''} value">
                    ${item ? `${item.name} (${item.desc})` : '空'}
                </span>
            </div>`;
        }

        // Inventory
        if (p.inventory.length > 0) {
            html += '<div style="margin:10px 0;"><b>背包物品 (点击装备):</b></div>';
            for (let i = 0; i < p.inventory.length; i++) {
                const item = p.inventory[i];
                html += `<div class="inv-slot inv-item" data-idx="${i}" style="cursor:pointer;">
                    <span class="rarity-${item.rarity.toLowerCase()}">${SLOT_ICONS[item.slot]} ${item.name}</span>
                    <span class="value" style="font-size:9px;">${item.desc}</span>
                </div>`;
            }
        }

        // Active skills
        if (p.skills.length > 0) {
            html += '<div style="margin:10px 0;"><b>主动技能:</b></div>';
            for (let i = 0; i < p.skills.length; i++) {
                const s = p.skills[i];
                const key = i < 3 ? `[${SKILL_KEYS[i]}]` : `[${i+1}]`;
                const cd = p.skillCooldowns[s.name] || 0;
                html += `<div class="inv-slot">
                    <span>${key} ${s.icon} ${s.name} <span style="color:#3498db;font-size:9px;">消耗${s.cost}魔</span></span>
                    <span class="value" style="font-size:9px;">${s.desc} ${cd > 0 ? `(CD:${cd.toFixed(1)}s)` : ''}</span>
                </div>`;
            }
        }

        // Passive skills
        if (p.passives.length > 0) {
            html += '<div style="margin:10px 0;"><b>被动技能:</b></div>';
            for (const ps of p.passives) {
                html += `<div class="inv-slot" style="color:#2ecc71;">
                    <span>${ps.icon} ${ps.name} (${ps.level}级)</span>
                    <span style="font-size:9px;">${ps.desc}</span>
                </div>`;
            }
        }

        html += '<div style="text-align:center;margin-top:10px;font-size:10px;color:#555;">按 I 或 ESC 关闭 | 点击背包物品装备</div>';

        this.invPanel.innerHTML = html;
        this.invPanel.style.display = 'block';

        this.invPanel.querySelectorAll('.inv-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.idx);
                if (p && p.inventory[idx]) {
                    p.equipItem(p.inventory.splice(idx, 1)[0]);
                    this.showInventory(p);
                }
            });
        });
    }

    hideInventory() {
        this.invPanel.style.display = 'none';
    }

    // ─── Shop ─────────────────────────────────────
    showShop(player, floor) {
        const p = player || this._player;
        this._player = p;
        if (!p) return;

        if (!this._shopItems) {
            this._shopItems = [];
            for (let i = 0; i < 4; i++) {
                const item = generateItem(floor);
                item.price = this._calcBuyPrice(item);
                this._shopItems.push(item);
            }
        }

        let html = '<h3>🏪 地下商店</h3>';
        html += `<div style="font-size:11px;color:#888;margin-bottom:6px;">你有 🪙${p.gold} 金币</div>`;

        html += '<div style="margin-bottom:6px;"><b>出售中的装备:</b></div>';
        for (let i = 0; i < this._shopItems.length; i++) {
            const item = this._shopItems[i];
            const canBuy = p.gold >= item.price;
            html += `<div class="shop-item ${canBuy ? '' : 'no-afford'}" data-shop-idx="${i}" style="cursor:${canBuy ? 'pointer' : 'not-allowed'};">
                <span class="rarity-${item.rarity.toLowerCase()}">${SLOT_ICONS[item.slot]} ${item.name}</span>
                <span style="font-size:9px;color:#888;">${item.desc}</span>
                <span style="color:${canBuy ? '#f1c40f' : '#e74c3c'};font-weight:bold;">🪙${item.price}</span>
            </div>`;
        }

        html += '<div style="margin:10px 0;"><b>你的背包 (点击出售):</b></div>';
        if (p.inventory.length > 0) {
            for (let i = 0; i < p.inventory.length; i++) {
                const item = p.inventory[i];
                const sellPrice = this._calcSellPrice(item);
                html += `<div class="shop-item sell-item" data-sell-idx="${i}" style="cursor:pointer;">
                    <span class="rarity-${item.rarity.toLowerCase()}">${SLOT_ICONS[item.slot]} ${item.name}</span>
                    <span style="font-size:9px;color:#888;">${item.desc}</span>
                    <span style="color:#2ecc71;font-weight:bold;">出售 🪙${sellPrice}</span>
                </div>`;
            }
        } else {
            html += '<div style="font-size:11px;color:#555;">背包空空如也</div>';
        }

        html += '<div style="text-align:center;margin-top:10px;font-size:10px;color:#555;">按 E 或 ESC 关闭 | 点击商品购买 | 点击背包物品出售</div>';

        this.shopPanel.innerHTML = html;
        this.shopPanel.style.display = 'block';
        this.hideInventory();

        this.shopPanel.querySelectorAll('.shop-item:not(.sell-item)').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.shopIdx);
                const item = this._shopItems[idx];
                if (p && p.gold >= item.price) {
                    p.gold -= item.price;
                    p.inventory.push(item);
                    this._shopItems.splice(idx, 1);
                    this.showShop(p, floor);
                }
            });
        });

        this.shopPanel.querySelectorAll('.sell-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.sellIdx);
                if (p && p.inventory[idx]) {
                    const item = p.inventory[idx];
                    p.gold += this._calcSellPrice(item);
                    p.inventory.splice(idx, 1);
                    this.showShop(p, floor);
                }
            });
        });
    }

    hideShop() {
        this.shopPanel.style.display = 'none';
        this._shopItems = null;
    }

    _calcBuyPrice(item) {
        const base = { COMMON: 30, RARE: 80, EPIC: 180, LEGENDARY: 400 }[item.rarity] || 30;
        return base + Math.floor(Object.values(item.stats).reduce((s, v) => s + v * 5, 0));
    }

    _calcSellPrice(item) {
        return Math.floor(this._calcBuyPrice(item) * 0.4);
    }

    setPlayerRef(player) {
        this._player = player;
    }
}










class Input {
    constructor(canvas) {
        this.keys = {};
        this.mouse = { x: 0, y: 0, down: false, worldX: 0, worldY: 0, rightDown: false };
        this.justPressed = {};

        window.addEventListener('keydown', e => {
            if (!this.keys[e.code]) this.justPressed[e.code] = true;
            this.keys[e.code] = true;
        });
        window.addEventListener('keyup', e => { this.keys[e.code] = false; });

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            this.mouse.x = e.clientX - rect.left;
            this.mouse.y = e.clientY - rect.top;
        });
        canvas.addEventListener('mousedown', e => {
            if (e.button === 0) this.mouse.down = true;
            if (e.button === 2) this.mouse.rightDown = true;
        });
        canvas.addEventListener('mouseup', e => {
            if (e.button === 0) this.mouse.down = false;
            if (e.button === 2) this.mouse.rightDown = false;
        });
        canvas.addEventListener('contextmenu', e => e.preventDefault());
    }

    update(camera) {
        this.mouse.worldX = this.mouse.x + camera.x;
        this.mouse.worldY = this.mouse.y + camera.y;
    }

    consumeJustPressed() {
        const result = { ...this.justPressed };
        this.justPressed = {};
        return result;
    }
}

class Game {
    constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.canvas.width = 1024;
        this.canvas.height = 768;

        this.input = new Input(this.canvas);
        this.renderer = new Renderer(this.canvas);
        this.particles = new ParticleSystem();
        this.ui = new UI();

        this.player = null;
        this.dungeon = null;
        this.enemies = [];
        this.allProjectiles = [];
        this.damageNumbers = [];
        this.gameOver = false;
        this.currentRoom = null;

        // Timing
        this.lastTime = performance.now();
        this.fps = 60;
        this.fpsTimer = 0;
        this.fpsFrames = 0;

        // Pickup items on ground
        this.groundItems = [];

        this.init();
    }

    init() {
        this.dungeon = new Dungeon(1);
        const startPos = this.dungeon.startRoom.randomPosition;
        this.player = new Player(startPos.x, startPos.y);
        this.player.gold = 50; // Starting gold
        this.enemies = [];
        this.allProjectiles = [];
        this.damageNumbers = [];
        this.groundItems = [];
        this.gameOver = false;
        this.currentRoom = this.dungeon.startRoom;
        this.dungeon.startRoom.visited = true;
        this.dungeon.currentRoom = this.dungeon.startRoom;
        this.ui.hideGameOver();
        this.ui.setPlayerRef(this.player);
        this.ui.showFloorIndicator(1);

        // Give starter weapon
        this.player.equipItem(generateItem(1, 'weapon'));
    }

    start() {
        this.lastTime = performance.now();
        this.loop(this.lastTime);
    }

    loop(timestamp) {
        const rawDt = (timestamp - this.lastTime) / 1000;
        const dt = Math.min(rawDt, 0.1); // Cap delta to avoid spiral of death
        this.lastTime = timestamp;

        // FPS counter
        this.fpsFrames++;
        this.fpsTimer += rawDt;
        if (this.fpsTimer >= 0.5) {
            this.fps = Math.round(this.fpsFrames / this.fpsTimer);
            this.fpsFrames = 0;
            this.fpsTimer = 0;
        }

        if (!this.gameOver) {
            this.update(dt);
        }

        this.render(dt);
        requestAnimationFrame((t) => this.loop(t));
    }

    update(dt) {
        // Update input world coords
        this.input.update(this.renderer.camera);

        // Update player
        this.player.update(dt, this.input, this.dungeon);

        // Update renderer (camera + screenshake)
        this.renderer.updateCamera(this.player);
        this.renderer.update(dt);

        // Check current room
        const room = this.dungeon.getRoomAt(this.player.x, this.player.y);
        if (room && room !== this.currentRoom) {
            this.onEnterRoom(room);
        }
        this.currentRoom = room;
        if (room) this.dungeon.currentRoom = room;

        // Handle inputs
        const justPressed = this.input.consumeJustPressed();

        // Attack
        if (this.input.mouse.down) {
            const result = this.player.attack(this.input.mouse.worldX, this.input.mouse.worldY, dt);
            if (result) {
                const hits = this.player.performMeleeAttack(this.enemies, this.input.mouse.worldX, this.input.mouse.worldY);
                for (const hit of hits) {
                    const died = hit.enemy.takeDamage(hit.damage);
                    this.damageNumbers.push({
                        x: hit.enemy.x, y: hit.enemy.y,
                        amount: hit.damage, crit: hit.crit,
                        life: 0.8
                    });
                    this.particles.emitHit(hit.enemy.x, hit.enemy.y);
                    if (hit.crit) {
                        this.particles.emitCritHit(hit.enemy.x, hit.enemy.y);
                        this.renderer.screenShake(3, 0.1);
                    }
                    if (died) {
                        this.onEnemyKilled(hit.enemy);
                    }
                }
            }
        }

        // Skills (B, N, M keys)
        const skillKeys = ['KeyB', 'KeyN', 'KeyM'];
        for (let i = 0; i < skillKeys.length; i++) {
            if (justPressed[skillKeys[i]]) {
                this.useSkill(i);
            }
        }

        // Shop interaction
        if (justPressed['KeyE']) {
            if (this.currentRoom && this.currentRoom.type === 'shop') {
                this.ui.showShop(this.player, this.dungeon.floor);
            }
        }

        // Dash
        if (justPressed['Space']) {
            if (this.player.dash()) {
                this.particles.emit(this.player.x, this.player.y, 6, {
                    speed: [20, 60], life: [0.2, 0.4], color: '#3498db', size: [2, 4]
                });
            }
        }

        // Inventory toggle
        if (justPressed['KeyI']) {
            this.ui.showInventory(this.player);
        }

        // Update enemies
        for (const enemy of this.enemies) {
            const attackResult = enemy.update(dt, this.player, this.dungeon);
            if (attackResult) {
                if (attackResult.type === 'melee') {
                    const dmg = this.player.takeDamage(attackResult.damage);
                    if (dmg > 0) {
                        this.renderer.flashScreen('#f44', 0.08);
                        this.damageNumbers.push({
                            x: this.player.x, y: this.player.y,
                            amount: dmg, crit: attackResult.crit,
                            life: 0.8
                        });
                        this.particles.emitHit(this.player.x, this.player.y);
                    }
                    if (this.player.isDead) {
                        this.gameOver = true;
                        this.ui.showGameOver(this.player, this.dungeon);
                        this.particles.emitDeath(this.player.x, this.player.y, '#e74c3c');
                    }
                }
            }
        }

        // Collect all projectiles (enemy projectiles)
        this.allProjectiles = [];
        for (const enemy of this.enemies) {
            for (const p of enemy.projectiles) {
                this.allProjectiles.push(p);
            }
        }

        // Update projectiles & check player hits
        for (const p of this.allProjectiles) {
            updateProjectile(p, dt);
            if (p.active && dist(p.x, p.y, this.player.x, this.player.y) < this.player.radius + p.size) {
                const dmg = this.player.takeDamage(p.damage);
                if (dmg > 0) {
                    this.renderer.flashScreen('#f44', 0.06);
                    this.damageNumbers.push({
                        x: this.player.x, y: this.player.y,
                        amount: dmg, crit: false, life: 0.8
                    });
                    this.particles.emitHit(this.player.x, this.player.y);
                }
                p.active = false;
                if (this.player.isDead) {
                    this.gameOver = true;
                    this.ui.showGameOver(this.player, this.dungeon);
                    this.particles.emitDeath(this.player.x, this.player.y, '#e74c3c');
                }
            }
        }

        // Update damage numbers
        for (const dn of this.damageNumbers) {
            dn.life -= dt;
            dn.y -= 30 * dt;
        }
        this.damageNumbers = this.damageNumbers.filter(dn => dn.life > 0);

        // Update particles
        this.particles.update(dt);

        // Pickup ground items
        for (let i = this.groundItems.length - 1; i >= 0; i--) {
            const item = this.groundItems[i];
            if (dist(this.player.x, this.player.y, item.x, item.y) < 30) {
                this.player.inventory.push(item.item);
                this.particles.emit(item.x, item.y, 8, {
                    speed: [20, 60], life: [0.3, 0.6], color: item.item.color, size: [2, 4]
                });
                this.groundItems.splice(i, 1);
            }
        }

        // Update UI
        this.ui.updateHUD(this.player, this.dungeon, this.currentRoom, this.fps);
    }

    useSkill(index) {
        const result = this.player.useSkill(index, this.enemies, this.input.mouse.worldX, this.input.mouse.worldY, this);
        if (!result) return;
        for (const eff of result.effects) {
            if (eff.heal) {
                this.particles.emitHeal(this.player.x, this.player.y);
            } else if (eff.enemy) {
                const died = eff.enemy.takeDamage(eff.damage);
                this.damageNumbers.push({
                    x: eff.enemy.x, y: eff.enemy.y,
                    amount: eff.damage, crit: eff.crit, life: 0.8
                });
                if (eff.crit) {
                    this.particles.emitCritHit(eff.enemy.x, eff.enemy.y);
                    this.renderer.screenShake(3, 0.1);
                } else {
                    this.particles.emitHit(eff.enemy.x, eff.enemy.y);
                }
                if (died) this.onEnemyKilled(eff.enemy);
            }
        }
    }

    onEnterRoom(room) {
        if (room.visited) return;
        room.visited = true;
        this.dungeon.currentRoom = room;

        const enemies = spawnEnemiesForRoom(room, this.dungeon.floor);
        this.enemies.push(...enemies);
    }

    onEnemyKilled(enemy) {
        this.particles.emitDeath(enemy.x, enemy.y, enemy.color);

        // Boss death special effects
        if (enemy.isBoss) {
            this.renderer.screenShake(12, 0.6);
            this.renderer.flashScreen('#fff', 0.15);
            this.particles.emit(enemy.x, enemy.y, 60, {
                speed: [60, 250], life: [0.5, 1.8], color: '#f1c40f', size: [3, 12], gravity: 120
            });
            // Multiple expanding rings
            this.particles.particles.push(new RingParticle(enemy.x, enemy.y, 0, 150, 0.6, '#f1c40f'));
            this.particles.particles.push(new RingParticle(enemy.x, enemy.y, 0, 120, 0.4, '#e74c3c'));
            this.particles.particles.push(new RingParticle(enemy.x, enemy.y, 0, 80, 0.3, '#fff'));
            // Clear boss room and progress to next floor
            const bossRoom = this.dungeon.getRoomAt(enemy.x, enemy.y);
            if (bossRoom) bossRoom.cleared = true;
            // Go to next floor after short delay
            setTimeout(() => this.nextFloor(), 1500);
        }

        // XP and gold
        const leveledUp = this.player.gainXp(enemy.xpReward);
        this.player.gold += enemy.goldReward;

        if (leveledUp) {
            this.particles.emitLevelUp(this.player.x, this.player.y);
            this.renderer.screenShake(4, 0.3);
            this.ui.showLevelUp(this.player.level);
        }

        // Drop items
        const drop = generateDrop(this.dungeon.floor);
        this.player.gold += drop.gold;
        for (const item of drop.items) {
            this.groundItems.push({ x: enemy.x + (Math.random() - 0.5) * 40, y: enemy.y + (Math.random() - 0.5) * 40, item });
        }

        // Check room cleared
        const room = this.dungeon.getRoomAt(enemy.x, enemy.y);
        if (room) {
            room.enemies = room.enemies.filter(e => !e.isDead);
            if (room.enemies.length === 0) {
                room.cleared = true;
            }
        }

        // Remove from enemies list
        this.enemies = this.enemies.filter(e => e !== enemy);
    }

    nextFloor() {
        const nextFloor = this.dungeon.floor + 1;
        this.dungeon = new Dungeon(nextFloor);
        const startPos = this.dungeon.startRoom.randomPosition;
        this.player.x = startPos.x;
        this.player.y = startPos.y;
        this.enemies = [];
        this.allProjectiles = [];
        this.groundItems = [];
        this.damageNumbers = [];
        this.currentRoom = this.dungeon.startRoom;
        this.dungeon.startRoom.visited = true;
        this.dungeon.currentRoom = this.dungeon.startRoom;
        this.ui.showFloorIndicator(nextFloor);

        // Heal 20% HP and 40% MP on floor transition
        this.player.hp = Math.min(this.player.maxHp, this.player.hp + Math.floor(this.player.maxHp * 0.2));
        this.player.mp = Math.min(this.player.maxMp, this.player.mp + Math.floor(this.player.maxMp * 0.4));
    }

    render(dt) {
        this.renderer.clear();
        this.renderer.drawDungeon(this.dungeon);

        // Draw ground items
        for (const gi of this.groundItems) {
            const ix = gi.x - this.renderer.sx;
            const iy = gi.y - this.renderer.sy;
            const bob = Math.sin(Date.now() / 300 + gi.x) * 1;
            const glowColors = { COMMON: '#aaa', RARE: '#3498db', EPIC: '#9b59b6', LEGENDARY: '#e67e22' };
            const glowColor = glowColors[gi.item.rarity] || '#fff';
            // Glow
            this.renderer.ctx.fillStyle = gi.item.color + '44';
            this.renderer.ctx.beginPath();
            this.renderer.ctx.arc(ix, iy + bob, 10, 0, Math.PI * 2);
            this.renderer.ctx.fill();
            // Item diamond shape
            this.renderer.ctx.fillStyle = gi.item.color;
            this.renderer.ctx.save();
            this.renderer.ctx.translate(ix, iy + bob);
            this.renderer.ctx.rotate(Math.PI / 4);
            this.renderer.ctx.fillRect(-5, -5, 10, 10);
            this.renderer.ctx.restore();
            // Sparkle
            this.renderer.ctx.fillStyle = '#fff';
            this.renderer.ctx.fillRect(ix - 1, iy + bob - 1, 2, 2);
            // Label
            this.renderer.ctx.font = '9px monospace';
            this.renderer.ctx.fillStyle = glowColor;
            this.renderer.ctx.textAlign = 'center';
            this.renderer.ctx.fillText(gi.item.name, ix, iy - 12 + bob);
            this.renderer.ctx.textAlign = 'start';
        }

        // Draw enemies
        for (const enemy of this.enemies) {
            this.renderer.drawEnemy(enemy);
        }

        // Draw player
        if (!this.gameOver) {
            this.renderer.drawPlayer(this.player);
            this.renderer.drawAttackSlash(this.player);
        }

        // Draw projectiles
        this.renderer.drawProjectiles(this.allProjectiles);

        // Draw damage numbers
        for (const dn of this.damageNumbers) {
            this.renderer.drawDamageNumber(dn.x, dn.y, dn.amount, dn.crit);
        }

        // Draw particles
        this.particles.draw(this.renderer.ctx, this.renderer.camera);

        // Draw vignette
        this.renderer.drawVignette();

        // Draw minimap
        this.renderer.drawMinimap(this.dungeon, this.player);
    }
}

// Start the game
const gameCanvas = document.getElementById('game-canvas');
if (gameCanvas) {
    const game = new Game();
    game.start();
}

</script>
