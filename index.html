<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深渊探索者 - 肉鸽地牢</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer">
            <div id="hud"></div>
            <div id="level-up-notify"></div>
            <div id="floor-indicator"></div>
            <div id="inventory-panel"></div>
            <div id="shop-panel"></div>
            <div id="game-over-screen"></div>
            <div id="equip-bar"></div>
            <div id="class-select-overlay">
                <div id="class-select-card">
                    <h2>选择你的职业</h2>
                    <div id="class-grid"></div>
                    <button id="class-confirm-btn">开始冒险</button>
                </div>
            </div>
            <div id="profile-panel">
                <div id="profile-header">
                    <h3>📋 冒险者档案</h3>
                    <button id="profile-close">✕</button>
                </div>
                <div id="profile-content"></div>
            </div>
            <div id="chat-panel">
                <div id="chat-header">
                    <span>💬 聊天</span>
                    <button id="chat-close">✕</button>
                </div>
                <div id="chat-messages"></div>
                <div id="chat-input-row">
                    <input id="chat-input" placeholder="输入消息..." maxlength="80" />
                    <button id="chat-send">发送</button>
                </div>
            </div>
            <div id="tutorial-overlay">
                <div id="tutorial-card">
                    <div id="tutorial-icon"></div>
                    <h2 id="tutorial-title"></h2>
                    <p id="tutorial-text"></p>
                    <div id="tutorial-hint"></div>
                    <div id="tutorial-progress"></div>
                    <div id="tutorial-buttons">
                        <button id="tutorial-prev">上一步</button>
                        <button id="tutorial-next">下一步</button>
                        <button id="tutorial-skip">跳过教程</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
