<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深渊探索者 - 肉鸽地牢</title>
    <meta name="description" content="深渊探索者 - 俯视角肉鸽地牢探索游戏。5大职业、随机地牢、装备收集、Boss挑战！">
    <meta property="og:title" content="深渊探索者 - 肉鸽地牢">
    <meta property="og:description" content="5大职业、随机地牢、装备收集、Boss挑战！快来探索深渊！">
    <meta property="og:type" content="website">
    <!-- Sword favicon: 32x32 SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='blade' x1='0' y1='0' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%23e8e8e8'/%3E%3Cstop offset='0.5' stop-color='%23fff'/%3E%3Cstop offset='1' stop-color='%23ccc'/%3E%3C/linearGradient%3E%3ClinearGradient id='gold' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f1c40f'/%3E%3Cstop offset='1' stop-color='%23e67e22'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='12' fill='%231a1a2e'/%3E%3C!-- blade --%3E%3Cpolygon points='32,6 27,32 37,32' fill='url(%23blade)'/%3E%3Cpolygon points='30,8 32,6 34,8 32,32' fill='%23fff' opacity='0.4'/%3E%3C!-- guard --%3E%3Crect x='18' y='32' width='28' height='4' rx='1' fill='url(%23gold)'/%3E%3Ccircle cx='32' cy='34' r='2.5' fill='%23e67e22'/%3E%3C!-- grip --%3E%3Crect x='29' y='36' width='6' height='12' rx='2' fill='%238B4513'/%3E%3Crect x='30' y='37' width='2' height='10' fill='%23a0522d'/%3E%3C!-- pommel --%3E%3Ccircle cx='32' cy='50' r='4' fill='url(%23gold)'/%3E%3Ccircle cx='32' cy='50' r='2' fill='%23e67e22'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer">
            <div id="hud"></div>
            <div id="level-up-notify"></div>
            <div id="floor-indicator"></div>
            <div id="inventory-panel"></div>
            <div id="shop-panel"></div>
            <div id="game-over-screen"></div>
            <div id="equip-bar"></div>
            <div id="class-select-overlay">
                <div id="class-select-card">
                    <h2>选择你的职业</h2>
                    <div id="class-grid"></div>
                    <button id="class-confirm-btn">开始冒险</button>
                </div>
            </div>
            <div id="profile-panel">
                <div id="profile-header">
                    <h3>📋 冒险者档案</h3>
                    <button id="profile-close">✕</button>
                </div>
                <div id="profile-content"></div>
            </div>
            <div id="chat-panel">
                <div id="chat-header">
                    <span>💬 聊天</span>
                    <button id="chat-close">✕</button>
                </div>
                <div id="chat-messages"></div>
                <div id="chat-input-row">
                    <input id="chat-input" placeholder="输入消息..." maxlength="80" />
                    <button id="chat-send">发送</button>
                </div>
            </div>
            <div id="tutorial-overlay">
                <div id="tutorial-card">
                    <div id="tutorial-icon"></div>
                    <h2 id="tutorial-title"></h2>
                    <p id="tutorial-text"></p>
                    <div id="tutorial-hint"></div>
                    <div id="tutorial-progress"></div>
                    <div id="tutorial-buttons">
                        <button id="tutorial-prev">上一步</button>
                        <button id="tutorial-next">下一步</button>
                        <button id="tutorial-skip">跳过教程</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
